const RAIO_MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const RAIO_META={
  gnt:{nome:'GNT',cor:'#7c3aed',corHex:'6D28D9',bg:'bg-purple-950/40',border:'border-purple-800/50',txt:'text-purple-300',grad:'from-purple-700 to-purple-900'},
  globoplay:{nome:'Globoplay',cor:'#dc2626',corHex:'DC2626',bg:'bg-red-950/40',border:'border-red-800/50',txt:'text-red-300',grad:'from-red-600 to-orange-700'},
  telecine:{nome:'Telecine',cor:'#1d4ed8',corHex:'1E3A8A',bg:'bg-blue-950/40',border:'border-blue-800/50',txt:'text-blue-300',grad:'from-blue-700 to-indigo-900'},
};

// Detecção de tipos de ajuste independente da marca atual
function raioTiposAjuste(card){
  const labels=(card.labels||[]).map(l=>normTxt(l.name).trim());
  const tipos=[
    {k:'interno',  kw:['ajuste int']},
    {k:'externo',  kw:['ajuste ext']},
    {k:'alteracao',kw:['alteracao','alterar']},
    {k:'correcao', kw:['correcao','corrigir']},
    {k:'marca',    exact:['ajuste','ajustes']},
  ];
  const found=[];
  for(const t of tipos){
    let hit=false;
    if(t.kw){const kws=t.kw.map(normTxt);hit=labels.some(l=>kws.some(k=>l.includes(k)));}
    if(!hit&&t.exact){hit=labels.some(l=>t.exact.includes(l));}
    if(hit) found.push(t.k);
  }
  return found;
}
function raioIsUrgencia(card){
  return (card.labels||[]).some(l=>{const n=normTxt(l.name);return n.includes('urgencia')||n.includes('urgente');});
}


// Dias úteis (seg–sex) de um mês
function diasUteisMes(mesIdx){
  const ano=2026;let n=0;
  const last=new Date(ano,mesIdx+1,0).getDate();
  for(let d=1;d<=last;d++){const wd=new Date(ano,mesIdx,d).getDay();if(wd>=1&&wd<=5)n++;}
  return n;
}
// Dias úteis do mês em que a pessoa esteve DISPONÍVEL
// (descontando as ausências do Cronograma Globers, lido da planilha)
function diasDisponiveis(brandKey,nome,mesIdx){
  const ano=2026;
  const nn=normTxt(nome);
  const notas=getNotas().filter(n=>{
    const nx=normTxt(n.nome);
    return nn.includes(nx)||nx.includes(nn)||nn.split(' ')[0]===nx.split(' ')[0];
  });
  const last=new Date(ano,mesIdx+1,0).getDate();
  let disp=0;
  for(let d=1;d<=last;d++){
    const dia=new Date(ano,mesIdx,d);
    const wd=dia.getDay();
    if(wd<1||wd>5) continue;
    const ausente=notas.some(n=>dia>=notaInicio(n)&&dia<=notaFim(n));
    if(!ausente) disp++;
  }
  return disp;
}

async function carregarRaioX(brandKey){
  if(ST.raioLoading) return;
  ST.raioBrand=brandKey;
  if(ST.raioData&&ST.raioData[brandKey]){renderView();return;} // já em cache
  ST.raioLoading=true;
  renderView();
  try{
    await fetchCrono();
    const b=BRANDS[brandKey];
    const [cards,members]=await Promise.all([
      fetchAllCardsFor(b.board),
      req(`/boards/${b.board}/members?fields=fullName,username`).catch(()=>[]),
    ]);
    const cs=[...new Map(cards.map(c=>[c.id,c])).values()].filter(c=>{
      const d=dCard(c)||dCardTitulo(c);return d&&d>=MIN;
    });
    if(!ST.raioData) ST.raioData={};
    ST.raioData[brandKey]={cards:cs,members};
  }catch(e){
    alert('Erro ao carregar dados da Análise Mensal:\n'+e.message);
    ST.raioBrand=null;
  }
  ST.raioLoading=false;
  renderView();
}

function raioNome(brandKey,id){
  const m=(ST.raioData[brandKey].members||[]).find(x=>x.id===id);
  return m?normNome(m.fullName||m.username):null;
}

// Estatísticas de uma marca num mês (com aproveitamento por membro)
function raioStats(brandKey,mesIdx){
  const ano=2026;
  const s=new Date(ano,mesIdx,1,0,0,0,0), e=new Date(ano,mesIdx+1,0,23,59,59,999);
  const cards=ST.raioData[brandKey].cards.filter(c=>{
    const d=dCard(c)||dCardTitulo(c);return d&&d>=s&&d<=e;
  });
  const ajCards=cards.filter(c=>raioTiposAjuste(c).length>0);
  const producoes=cards.length-ajCards.length;
  const ajustes=ajCards.length;
  const conteudos=producoes;
  const pct=conteudos?Math.round(ajustes/conteudos*100):0;
  const urgencias=cards.filter(raioIsUrgencia).length;
  const ajBreak={interno:0,externo:0,alteracao:0,correcao:0,marca:0};
  ajCards.forEach(c=>raioTiposAjuste(c).forEach(k=>ajBreak[k]++));
  // Top formatos
  const fmtCnt={};
  cards.forEach(c=>detectFormatos(c,brandKey).forEach(k=>fmtCnt[k]=(fmtCnt[k]||0)+1));
  const topFormatos=Object.entries(fmtCnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,n])=>[fmtLabel(k,brandKey),n]);
  // Membros com APROVEITAMENTO: cards, % do total, dias úteis disponíveis, média por dia útil
  const du=diasUteisMes(mesIdx);
  const memCnt={};
  cards.forEach(c=>{
    [...new Set((c.idMembers||[]).map(id=>raioNome(brandKey,id)).filter(Boolean))].forEach(n=>memCnt[n]=(memCnt[n]||0)+1);
  });
  const totalMem=Object.values(memCnt).reduce((a,b)=>a+b,0)||1;
  const membros=Object.entries(memCnt).map(([nome,n])=>{
    const disp=diasDisponiveis(brandKey,nome,mesIdx);
    return{
      nome, cards:n,
      pctTotal:Math.round(n/totalMem*100),
      diasUteis:du, diasDisp:disp,
      diasFora:du-disp,
      mediaDia:disp?+(n/disp).toFixed(1):0,
    };
  }).sort((a,b)=>b.cards-a.cards);
  // Ritmo do time: conteúdos por dia útil do mês
  const ritmo=du?+(producoes/du).toFixed(1):0;
  // Dia da semana de pico (onde as entregas se concentram)
  const wdNames=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const wdCnt=[0,0,0,0,0,0,0];
  cards.forEach(c=>{const d=dCard(c)||dCardTitulo(c);if(d)wdCnt[d.getDay()]++;});
  const wdMax=Math.max(...wdCnt);
  const diaPico=wdMax>0?{nome:wdNames[wdCnt.indexOf(wdMax)],n:wdMax,pct:cards.length?Math.round(wdMax/cards.length*100):0}:null;
  return{producoes,ajustes,conteudos,pct,urgencias,ajBreak,topFormatos,membros,diasUteis:du,ritmo,diaPico};
}

// ============================================================
// INSIGHTS AUTOMÁTICOS
// ============================================================
function gerarInsights(brandKey,sel,stats){
  const nome=RAIO_META[brandKey].nome;
  const first=sel[0],last=sel[sel.length-1];
  const a=stats[first],b=stats[last];
  const multi=sel.length>1;
  const cand=[];

  // 1) Produção
  if(multi){
    const dp=b.producoes-a.producoes;
    const pctVar=a.producoes?Math.round(dp/a.producoes*100):0;
    if(dp>0) cand.push(`Produção em alta: ${nome} entregou ${b.producoes} conteúdos em ${RAIO_MESES[last]}, +${dp} (${pctVar>0?'+':''}${pctVar}%) vs ${RAIO_MESES[first]}.`);
    else if(dp<0) cand.push(`Produção em queda: ${b.producoes} conteúdos em ${RAIO_MESES[last]}, ${dp} (${pctVar}%) vs ${RAIO_MESES[first]}. Vale investigar se foi demanda menor ou gargalo.`);
    else cand.push(`Produção estável entre ${RAIO_MESES[first]} e ${RAIO_MESES[last]}: ${b.producoes} conteúdos em cada.`);
  }else{
    cand.push(`${nome} em ${RAIO_MESES[last]}: ${b.producoes} conteúdos, ${b.ajustes} ajustes (${b.pct}%) e ${b.urgencias} urgência${b.urgencias!==1?'s':''}.`);
  }

  // 2) Ritmo do time, normalizado pelos dias úteis
  if(multi&&a.ritmo>0&&b.ritmo>0){
    if(b.ritmo>a.ritmo) cand.push(`Ritmo do time acelerou: ${b.ritmo} conteúdos por dia útil em ${RAIO_MESES[last]} vs ${a.ritmo} em ${RAIO_MESES[first]}, mesmo comparando meses com quantidades diferentes de dias úteis.`);
    else if(b.ritmo<a.ritmo) cand.push(`Ritmo do time desacelerou: ${b.ritmo} conteúdos por dia útil em ${RAIO_MESES[last]} vs ${a.ritmo} em ${RAIO_MESES[first]}.`);
  }else if(b.ritmo>0){
    cand.push(`Ritmo do time em ${RAIO_MESES[last]}: ${b.ritmo} conteúdos por dia útil (${b.producoes} em ${b.diasUteis} dias).`);
  }

  // 3) Taxa geral de ajustes
  if(multi){
    if(b.pct<a.pct) cand.push(`Qualidade melhorou: taxa de ajustes caiu de ${a.pct}% em ${RAIO_MESES[first]} para ${b.pct}% em ${RAIO_MESES[last]}.`);
    else if(b.pct>a.pct) cand.push(`Atenção à qualidade: taxa de ajustes subiu de ${a.pct}% para ${b.pct}%. Vale reforçar a revisão antes do envio.`);
  }

  // 4) Tipo de ajuste com maior movimento entre os meses
  const tipoNomes={correcao:'correções',alteracao:'alterações',interno:'ajustes internos',externo:'ajustes externos',marca:'ajustes (tag do canal)'};
  if(multi){
    const movs=Object.keys(tipoNomes).map(k=>{
      const va=a.ajBreak[k]||0,vb=b.ajBreak[k]||0;
      return{k,va,vb,d:vb-va,abs:Math.abs(vb-va)};
    }).filter(m=>m.va>0||m.vb>0).sort((x,y)=>y.abs-x.abs);
    if(movs.length&&movs[0].abs>0){
      const m=movs[0];
      if(m.d<0) cand.push(`Boa evolução: ${tipoNomes[m.k]} caíram de ${m.va} em ${RAIO_MESES[first]} para ${m.vb} em ${RAIO_MESES[last]}.`);
      else cand.push(`Ponto de atenção: ${tipoNomes[m.k]} subiram de ${m.va} em ${RAIO_MESES[first]} para ${m.vb} em ${RAIO_MESES[last]}.`);
    }
  }

  // 5) Foco de melhoria claro: tipo que domina os ajustes
  if(b.ajustes>0){
    const topTipo=Object.entries(b.ajBreak).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1])[0];
    if(topTipo&&topTipo[1]/b.ajustes>=0.5){
      cand.push(`Foco de melhoria claro: ${tipoNomes[topTipo[0]]} representam ${Math.round(topTipo[1]/b.ajustes*100)}% de todos os ajustes de ${RAIO_MESES[last]}. Atacar essa frente reduz a taxa geral.`);
    }
  }

  // 6) Concentração de formatos: acima de 40% é ALERTA, o time não pode olhar para um formato só
  if(b.topFormatos.length>=2){
    const totalFmt=b.topFormatos.reduce((acc,[,x])=>acc+x,0);
    const top1=b.topFormatos[0];
    if(totalFmt&&top1[1]/totalFmt>=0.4){
      cand.push(`Alerta de concentração de formatos: ${top1[0]} responde sozinho por ${Math.round(top1[1]/totalFmt*100)}% da produção de ${RAIO_MESES[last]}. Com a variedade de formatos disponível, isso indica que o time está olhando demais para um único formato. É preciso equilibrar a distribuição entre os demais.`);
    }else if(totalFmt){
      cand.push(`Boa distribuição de formatos em ${RAIO_MESES[last]}: ${b.topFormatos.length}+ formatos em uso e o líder (${top1[0]}) fica com ${Math.round(top1[1]/totalFmt*100)}%, sem concentração excessiva.`);
    }
  }

  // 7) Urgências
  if(multi){
    if(b.urgencias>a.urgencias) cand.push(`Urgências subiram (${a.urgencias} para ${b.urgencias}). Pode indicar planejamento apertado ou demandas reativas do cliente.`);
    else if(b.urgencias<a.urgencias&&a.urgencias>0) cand.push(`Urgências caíram (${a.urgencias} para ${b.urgencias}), fluxo mais previsível.`);
  }

  // 8) Dia da semana de pico
  if(b.diaPico&&b.diaPico.pct>=30){
    cand.push(`${b.diaPico.nome} concentra ${b.diaPico.pct}% das entregas de ${RAIO_MESES[last]} (${b.diaPico.n} cards). Vale antecipar produção para aliviar o pico.`);
  }

  // Monta os 6: cinco primeiros candidatos + membro destaque SEMPRE por último (demandado e maior média juntos)
  const ins=cand.slice(0,5);
  const topM=b.membros[0];
  const topMedia=[...b.membros].filter(m=>m.diasDisp>0).sort((x,y)=>y.mediaDia-x.mediaDia)[0];
  if(topM){
    let txt=`Membro destaque de ${RAIO_MESES[last]}: ${topM.nome}, o mais demandado com ${topM.cards} cards (${topM.pctTotal}% do time)`;
    if(topMedia&&topMedia.nome===topM.nome){
      txt+=` e dono da maior média diária (${topMedia.mediaDia} cards por dia útil disponível${topMedia.diasFora>0?`, mesmo com ${topMedia.diasFora} dias fora`:''}).`;
    }else if(topMedia){
      txt+=`; a maior média diária foi de ${topMedia.nome} (${topMedia.mediaDia} cards por dia útil${topMedia.diasFora>0?`, mesmo com ${topMedia.diasFora} dias fora`:''}).`;
    }else{
      txt+='.';
    }
    ins.push(txt);
  }
  return ins;
}

let _pptxLibPromise=null;
function carregarPptxLib(){
  if(typeof PptxGenJS!=='undefined') return Promise.resolve();
  if(_pptxLibPromise) return _pptxLibPromise;
  const urls=[
    'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.min.js',
  ];
  _pptxLibPromise=new Promise((resolve,reject)=>{
    let i=0;
    function tenta(){
      if(typeof PptxGenJS!=='undefined') return resolve();
      if(i>=urls.length){_pptxLibPromise=null;return reject(new Error('Não foi possível carregar a biblioteca de PPTX. Verifique a conexão e tente de novo.'));}
      const s=document.createElement('script');
      s.src=urls[i++];
      s.onload=()=>typeof PptxGenJS!=='undefined'?resolve():tenta();
      s.onerror=()=>tenta();
      document.head.appendChild(s);
    }
    tenta();
  });
  return _pptxLibPromise;
}

async function gerarPPTX(){
  const btn=document.getElementById('btn-pptx');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Gerando...';}
  try{
    await carregarPptxLib();
    montarPPTX();
  }catch(e){
    alert(e.message||'Erro ao gerar o PPTX.');
  }
  if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-download mr-1.5"></i>Baixar PPTX';}
}

function renderComparativo(mc){
  // Drilldown: se tem mês selecionado, mostra os cards
  if(ST.compMes!==null){
    renderCompMesDetalhe(mc, ST.compMes);
    return;
  }

  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const ano=new Date().getFullYear();
  const mesAtual=new Date().getMonth();
  const fp=ST.fp;

  // Produções = cards com due date (dCard), filtrados por pauta se ativo
  function getProducoes(i){
    const s=new Date(ano,i,1,0,0,0,0), e=new Date(ano,i+1,0,23,59,59,999);
    let cs=ST.cards.filter(c=>{const d=dCard(c);return d&&d>=s&&d<=e;});
    if(fp) cs=cs.filter(c=>progs(c).includes(fp));
    return cs.length;
  }

  // Agendamento = cards com data no título, sem Decupagem e sem cards de Ajuste
  // (correção/alteração/ajuste têm data no título referenciando o post original,
  //  mas não são agendamentos — não devem inflar essa contagem)
  function getAgendamento(i){
    const s=new Date(ano,i,1,0,0,0,0), e=new Date(ano,i+1,0,23,59,59,999);
    let cs=ST.cards.filter(c=>{
      if(isDecupagem(c)) return false;
      if(isAjuste(c)||tiposAjuste(c).length>0) return false;
      const d=dCardTitulo(c);return d&&d>=s&&d<=e;
    });
    if(fp) cs=cs.filter(c=>progs(c).includes(fp));
    return cs.length;
  }

  const dadosProd=meses.map((_,i)=>i>mesAtual?0:getProducoes(i));
  const dadosAgend=meses.map((_,i)=>i>mesAtual?0:getAgendamento(i));

const AI_HIST = [];
// IA via API da Anthropic (Claude): usa a chave colada em Configurações do Estúdio (fica só no navegador).
const ANTHROPIC_KEY_DE=()=>{ try{ return localStorage.getItem('apiKey')||''; }catch(e){ return ''; } };
const AI_MODEL=(()=>{ try{ return localStorage.getItem('apiModel')||'claude-sonnet-5-5'; }catch(e){ return 'claude-sonnet-5-5'; } })();

function buildContexto(){
  const{s,e}=getRange();
  const cards=filt();
  const periodo=`${s.toLocaleDateString('pt-BR')} a ${e.toLocaleDateString('pt-BR')}`;
  const pC={};cards.forEach(c=>progs(c).forEach(p=>{pC[p]=(pC[p]||0)+1;}));
  const topPautas=Object.entries(pC).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([p,n])=>`${p}: ${n}`).join(', ');
  const dedup=dedupM(cards);
  const topMembros=dedup.slice(0,8).map(([n,i])=>`${n}: ${i.count}`).join(', ');
  const nC={instagram:0,tiktok:0,facebook:0,youtube:0};
  cards.forEach(c=>{const r=detectRede(c);if(r&&r in nC)nC[r]++;});
  const redes=Object.entries(nC).filter(([,v])=>v>0).map(([r,v])=>`${REDES[r].label}: ${v}`).join(', ');
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const ano=new Date().getFullYear();
  const mesAtual=new Date().getMonth();
  const compMensal=meses.map((m,i)=>{
    if(i>mesAtual) return null;
    const ms=new Date(ano,i,1,0,0,0,0),me=new Date(ano,i+1,0,23,59,59,999);
    const prod=ST.cards.filter(c=>{const d=dCard(c);return d&&d>=ms&&d<=me;}).length;
    const agend=ST.cards.filter(c=>{if(isDecupagem(c))return false;const d=dCardTitulo(c);return d&&d>=ms&&d<=me;}).length;
    return`${m}: prod=${prod}, agend=${agend}`;
  }).filter(Boolean).join(' | ');
  const ajustes=ST.cards.filter(c=>isAjuste(c)).length;
  return`Você é um assistente especializado em análise de dados de redes sociais para o time ${BRANDS[CURRENT_BRAND].label}. Responda sempre em português, de forma direta e útil.

== DADOS DO DASHBOARD ==
Período ativo: ${periodo} (${ST.periodo==='semana'?'semana':ST.periodo==='mes'?'mês':'ano'})
Filtro de pauta ativo: ${ST.fp||'Nenhum (todos)'}
Aba atual: ${ST.view}
Total de cards no board: ${ST.cards.length}
Posts com data no período: ${cards.length}
Ajustes pendentes: ${ajustes}
Top pautas (posts no período): ${topPautas||'Nenhuma'}
Top membros (posts no período): ${topMembros||'Nenhum'}
Redes sociais: ${redes||'Nenhuma'}
Comparativo mensal ${ano}: ${compMensal}
Notas da equipe (férias/atendimentos): ${getNotas().length?getNotas().map(n=>`${n.nome}: ${notaLabel(n)}`).join(' | '):'N/A'}
== FIM DOS DADOS ==`;
}

async function enviarMensagemIA(){
  const inp = document.getElementById('ai-inp');
  const msg = inp.value.trim();
  if(!msg) return;
  inp.value = ''; inp.disabled = true;

  adicionarMensagem('user', msg);
  AI_HIST.push({role:'user', content: msg});

  const typing = adicionarMensagem('assistant','<span class="opacity-50 animate-pulse">Analisando os dados...</span>');
  if(!ANTHROPIC_KEY_DE()){ typing.innerHTML='<span class="text-red-400">Cole a chave da API em Configurações do Estúdio (a mesma do editor) e tente de novo.</span>'; inp.disabled=false; return; }

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': ANTHROPIC_KEY_DE(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model: AI_MODEL,
        max_tokens: 1024,
        system: buildContexto(),
        messages: AI_HIST.slice(-12)
      })
    });
    const data = await res.json();
    if(data.error){ throw new Error(data.error.message||('A API respondeu '+res.status)); }
    const resposta = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim() || 'Sem resposta.';
    typing.innerHTML = formatarResposta(resposta);
    AI_HIST.push({role:'assistant', content: resposta});
  } catch(e){
    typing.innerHTML = `<span class="text-red-400">Erro: ${esc(e.message)}</span>`;
  }
  inp.disabled = false; inp.focus(); scrollChat();
}




function formatarResposta(txt){
  return esc(txt)
    .replace(/\*\*(.*?)\*\*/g,'<strong class="text-white">$1</strong>')
    .replace(/\*(.*?)\*/g,'<em class="text-gray-300">$1</em>')
    .replace(/\n/g,'<br>');
}

function adicionarMensagem(role, html){
  const wrap=document.getElementById('ai-msgs');
  const div=document.createElement('div');
  div.className=role==='user'?'flex justify-end mb-3':'flex justify-start mb-3';
  div.innerHTML=role==='user'
    ?`<div class="bg-blue-600 text-white text-sm rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-[85%]">${esc(html)}</div>`
    :`<div class="bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded-2xl rounded-tl-sm px-4 py-2.5 max-w-[90%] leading-relaxed">${html}</div>`;
  wrap.appendChild(div);
  scrollChat();
  return div.querySelector('div');
}

function scrollChat(){ const w=document.getElementById('ai-msgs'); if(w) w.scrollTop=w.scrollHeight; }


function toggleAI(){
  const panel=document.getElementById('ai-panel');
  const isOpen=panel.style.transform==='translateX(0px)'||panel.style.transform==='translateX(0)';
  panel.style.transform=isOpen?'translateX(100%)':'translateX(0)';
  if(!isOpen){
    const wrap=document.getElementById('ai-msgs');
    if(wrap && wrap.children.length === 0){
      adicionarMensagem('assistant',`Olá! 👋 Sou o assistente do dashboard ${BRANDS[CURRENT_BRAND].label}.<br><br>Posso responder perguntas sobre os dados carregados agora.<br><br><strong class="text-white">Exemplos:</strong><br>• "Quem foi o mais demandado esse mês?"<br>• "Quantos posts o Instagram teve?"<br>• "Qual pauta teve mais entregas?"<br>• "Como foi março vs abril?"`);
    }
    setTimeout(()=>document.getElementById('ai-inp')?.focus(),300);
  }
}
</script>

<!-- ===== PAINEL IA ===== -->
<div id="ai-panel" class="fixed right-0 top-0 h-full w-full max-w-sm bg-gray-900 border-l border-gray-800 z-40 flex flex-col shadow-2xl" style="transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)">
  <!-- Header -->
  <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-800 flex-shrink-0">
    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-violet-600 to-blue-600 flex items-center justify-center flex-shrink-0">
      <i class="fa-solid fa-robot text-white text-sm"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p class="font-semibold text-sm">Assistente IA</p>
    </div>
    <button onclick="toggleAI()" class="w-7 h-7 flex items-center justify-center rounded-lg text-gray-500 hover:text-white hover:bg-gray-800 transition-colors text-lg flex-shrink-0">×</button>
  </div>

  <!-- Mensagens -->
  <div id="ai-msgs" class="flex-1 overflow-y-auto px-4 py-4 space-y-1"></div>

  <!-- Input -->
  <div class="flex-shrink-0 border-t border-gray-800 px-4 py-3">
    <div class="flex gap-2 bg-gray-800 border border-gray-700 rounded-2xl px-3 py-2 focus-within:border-blue-500 transition-colors">
      <input id="ai-inp" type="text" placeholder="Pergunte sobre o dashboard..."
        class="flex-1 bg-transparent text-sm text-white placeholder-gray-600 focus:outline-none"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMensagemIA();}">
      <button onclick="enviarMensagemIA()" class="w-7 h-7 flex items-center justify-center rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition-colors flex-shrink-0">
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>
    <p class="text-[10px] text-gray-700 mt-1.5 text-center">Baseado nos dados carregados do Trello</p>
  </div>
</div>

<!-- ===== BOTÃO FLUTUANTE IA ===== -->
<button onclick="toggleAI()" id="ai-fab"
  class="fixed bottom-24 right-6 z-40 w-[52px] h-[52px] bg-gradient-to-br from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white rounded-2xl shadow-lg shadow-violet-900/40 flex items-center justify-center transition-all hover:scale-105 active:scale-95">
  <i class="fa-solid fa-robot text-xl"></i>
</button>

<script>
/* ===== ponte com o Estúdio de Conteúdo ===== */
(function(){
  const P=new URLSearchParams(location.search), EMB=P.get('embed')==='1';
  const pm=m=>{ try{ if(window.parent!==window) window.parent.postMessage(m, location.origin); }catch(e){} };
  if(EMB){ document.documentElement.classList.add('embed'); const mk=P.get('marca'); if(mk&&BRANDS[mk]) sessionStorage.setItem('brand',mk); }
  const _sw=switchBrand; window.switchBrand=async function(k){ await _sw(k); pm({type:'atd:marca', marca:k}); };
  // card do Trello vira job no Estúdio
  const _ab=abrirCard; window.abrirCard=function(card,noDesc){ _ab(card,noDesc); const w=document.getElementById('mc-link-wrap'); if(!w||!card||!card.id) return; w.classList.remove('hidden');
    const b=document.createElement('button'); b.className='estudio-btn'; b.innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i> Abrir no Estúdio (vira job)';
    b.onclick=()=>{ const msg={type:'atd:card', marca:CURRENT_BRAND, card:{id:card.id, name:card.name, desc:card.desc||'', url:'https://trello.com/c/'+card.id, due:card.due||null}};
      if(window.parent!==window){ pm(msg); fecharModalCard(); } else { try{ localStorage.setItem('estudio:card', JSON.stringify(msg)); }catch(e){} window.open('index.html?v=novo&card=1','_blank'); } };
    w.appendChild(b);
    if(window.parent!==window){ const b2=document.createElement('button'); b2.className='estudio-btn alt'; b2.innerHTML='<i class="fa-solid fa-table-columns"></i> Trazer pro quadro da Criação';
      b2.onclick=()=>{ pm({type:'atd:pauta', marca:CURRENT_BRAND, card:{id:card.id, name:card.name, desc:card.desc||'', url:'https://trello.com/c/'+card.id, due:card.due||null}}); fecharModalCard(); };
      w.appendChild(b2); } };
  window.addEventListener('message', async e=>{
    if(e.origin!==location.origin) return; const d=e.data||{};
    if(d.type==='estudio:marca' && BRANDS[d.marca]){ if(sessionStorage.getItem('dash_auth')==='1' && CURRENT_BRAND && CURRENT_BRAND!==d.marca) await _sw(d.marca); else sessionStorage.setItem('brand', d.marca); }
    if(d.type==='estudio:comentar' && d.cardId){
      try{ const r=await fetch(`https://api.trello.com/1/cards/${encodeURIComponent(d.cardId)}/actions/comments?key=${KEY}&token=${TOKEN}&text=${encodeURIComponent(d.texto||'')}`,{method:'POST',headers:{Accept:'application/json'}}); pm({type:'atd:comentado', jobId:d.jobId, ok:r.ok, erro:r.ok?'':'HTTP '+r.status}); }
      catch(err){ pm({type:'atd:comentado', jobId:d.jobId, ok:false, erro:err.message}); }
    }
  });
  pm({type:'atd:pronto'});
})();
</script>
</body>
</html>
