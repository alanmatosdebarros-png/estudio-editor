<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento · Estúdio de Conteúdo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#374151;border-radius:99px}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ch{transition:transform .18s,box-shadow .18s}
.ch:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* tema do Estúdio de Conteúdo (mesmo visual da plataforma) */
*{font-family:'DM Sans','Inter',system-ui,sans-serif}
html[data-tema="escuro"] body{background:radial-gradient(1200px 600px at 70% -200px, rgba(255,90,42,.10), transparent 60%),#0b0b10!important}
html[data-tema="escuro"] .bg-gray-950{background-color:#0b0b10!important}html[data-tema="escuro"] .bg-gray-900{background-color:#14141c!important}html[data-tema="escuro"] .bg-gray-800{background-color:#1b1b26!important}html[data-tema="escuro"] .bg-gray-700{background-color:#262635!important}
html[data-tema="escuro"] .bg-gray-800\/60{background-color:rgba(27,27,38,.6)!important}html[data-tema="escuro"] .bg-gray-900\/60{background-color:rgba(20,20,28,.6)!important}html[data-tema="escuro"] .bg-gray-800\/50{background-color:rgba(27,27,38,.5)!important}
html[data-tema="escuro"] .border-gray-800{border-color:#262635!important}html[data-tema="escuro"] .border-gray-700{border-color:#30304a!important}html[data-tema="escuro"] .border-gray-700\/60{border-color:rgba(48,48,74,.6)!important}html[data-tema="escuro"] .border-gray-600{border-color:#3a3a55!important}
html[data-tema="escuro"] .text-gray-100{color:#f4f2f8!important}html[data-tema="escuro"] .text-gray-200{color:#e6e3ef!important}html[data-tema="escuro"] .text-gray-300{color:#d0cde0!important}html[data-tema="escuro"] .text-gray-400{color:#a3a1b3!important}html[data-tema="escuro"] .text-gray-500{color:#8a879c!important}html[data-tema="escuro"] .text-gray-600{color:#6e6c80!important}html[data-tema="escuro"] .text-gray-700{color:#55536a!important}
html[data-tema="escuro"] .hover\:bg-gray-800:hover{background-color:#1b1b26!important}html[data-tema="escuro"] .hover\:bg-gray-700:hover{background-color:#262635!important}
html[data-tema="escuro"] .bg-blue-600{background-color:#ff5a2a!important}html[data-tema="escuro"] .hover\:bg-blue-500:hover{background-color:#ff7a4a!important}html[data-tema="escuro"] .text-blue-400{color:#ff9a70!important}html[data-tema="escuro"] .text-blue-300{color:#ffb497!important}
html[data-tema="escuro"] .border-blue-500,html[data-tema="escuro"] .focus\:border-blue-500:focus,html[data-tema="escuro"] .focus-within\:border-blue-500:focus-within{border-color:#ff5a2a!important}html[data-tema="escuro"] .border-t-blue-500{border-top-color:#ff5a2a!important}
html[data-tema="escuro"] .rounded-3xl{border-radius:18px!important}html[data-tema="escuro"] .rounded-2xl{border-radius:14px!important}
html[data-tema="escuro"] #sidebar{background:rgba(20,20,28,.6)!important;backdrop-filter:blur(8px)}
html[data-tema="escuro"] .vb.bg-gray-800{background:rgba(255,90,42,.14)!important;box-shadow:inset 3px 0 0 #ff5a2a;color:#fff!important}
html[data-tema="escuro"] .from-violet-600{--tw-gradient-from:#ff5a2a var(--tw-gradient-from-position)!important}html[data-tema="escuro"] .to-blue-600{--tw-gradient-to:#ff8a3d var(--tw-gradient-to-position)!important}
html[data-tema="escuro"] input,html[data-tema="escuro"] select,html[data-tema="escuro"] textarea{background-color:#0f0f16!important}
.estudio-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#ff5a2a,#ff7a4a);color:#fff;border-radius:12px;padding:12px;font-size:14px;font-weight:700;margin-top:10px;border:0;cursor:pointer}
.estudio-btn:hover{filter:brightness(1.08)}
.estudio-btn.alt{background:transparent!important;border:1.5px solid #e8461a;color:#e8461a}
html.embed #ai-fab{bottom:24px}

/* ===== modo claro (padrão do Estúdio) ===== */
html[data-tema="claro"]{color-scheme:light}
html[data-tema="claro"] body{background:#f4f3f0!important;color:#16171b}
html[data-tema="claro"] *{font-family:'Onest','DM Sans',system-ui,sans-serif}
html[data-tema="claro"] .bg-gray-950,html[data-tema="claro"] .bg-gray-950\/60{background-color:#f4f3f0!important}
html[data-tema="claro"] .bg-gray-900,html[data-tema="claro"] .bg-gray-900\/60{background-color:#ffffff!important}
html[data-tema="claro"] .bg-gray-800,html[data-tema="claro"] .bg-gray-800\/60,html[data-tema="claro"] .bg-gray-800\/50{background-color:#f6f5f2!important}
html[data-tema="claro"] .bg-gray-700{background-color:#ece9e3!important}
html[data-tema="claro"] .border-gray-800{border-color:#e7e4de!important}html[data-tema="claro"] .border-gray-700,html[data-tema="claro"] .border-gray-700\/60,html[data-tema="claro"] .border-gray-600{border-color:#d9d5ce!important}
html[data-tema="claro"] .text-gray-100,html[data-tema="claro"] .text-gray-200,html[data-tema="claro"] .text-white{color:#16171b!important}
html[data-tema="claro"] .text-gray-300{color:#2e3038!important}html[data-tema="claro"] .text-gray-400{color:#5d616b!important}html[data-tema="claro"] .text-gray-500{color:#6f737c!important}html[data-tema="claro"] .text-gray-600,html[data-tema="claro"] .text-gray-700{color:#8e929b!important}
html[data-tema="claro"] .hover\:bg-gray-800:hover,html[data-tema="claro"] .hover\:bg-gray-800\/50:hover{background-color:#f1efea!important}html[data-tema="claro"] .hover\:bg-gray-700:hover,html[data-tema="claro"] .hover\:bg-gray-700\/60:hover{background-color:#ece9e3!important}
html[data-tema="claro"] .bg-blue-600{background-color:#e8461a!important}html[data-tema="claro"] .hover\:bg-blue-500:hover{background-color:#ff6b3d!important}
html[data-tema="claro"] .text-blue-400,html[data-tema="claro"] .text-blue-300{color:#c2380f!important}
html[data-tema="claro"] .text-orange-400{color:#d4520f!important}html[data-tema="claro"] .text-emerald-400,html[data-tema="claro"] .text-emerald-300{color:#16804a!important}html[data-tema="claro"] .text-amber-400,html[data-tema="claro"] .text-amber-300,html[data-tema="claro"] .text-yellow-400{color:#a86400!important}
html[data-tema="claro"] .text-cyan-400,html[data-tema="claro"] .text-cyan-300{color:#0b7f8c!important}html[data-tema="claro"] .text-red-400{color:#d93025!important}html[data-tema="claro"] .text-purple-400,html[data-tema="claro"] .text-pink-400{color:#9b2fc0!important}
html[data-tema="claro"] .bg-amber-900\/30{background-color:rgba(199,119,0,.10)!important}html[data-tema="claro"] .bg-blue-950{background-color:rgba(232,70,26,.08)!important}html[data-tema="claro"] .border-blue-800{border-color:rgba(232,70,26,.35)!important}
html[data-tema="claro"] .border-blue-500,html[data-tema="claro"] .focus\:border-blue-500:focus,html[data-tema="claro"] .focus-within\:border-blue-500:focus-within{border-color:#e8461a!important}html[data-tema="claro"] .border-t-blue-500{border-top-color:#e8461a!important}
html[data-tema="claro"] .rounded-3xl{border-radius:18px!important}html[data-tema="claro"] .rounded-2xl{border-radius:14px!important}
html[data-tema="claro"] #sidebar{background:#ffffff!important;border-color:#e7e4de!important}
html[data-tema="claro"] .vb.bg-gray-800{background:rgba(232,70,26,.09)!important;box-shadow:none;color:#c2380f!important}
html[data-tema="claro"] .bg-gray-900.border,html[data-tema="claro"] .bg-gray-900.rounded-2xl,html[data-tema="claro"] .bg-gray-900.rounded-3xl{box-shadow:0 1px 2px rgba(22,23,27,.04),0 8px 24px -12px rgba(22,23,27,.12)}
html[data-tema="claro"] input,html[data-tema="claro"] select,html[data-tema="claro"] textarea{background-color:#fff!important;color:#16171b!important;border-color:#d9d5ce!important}
/* texto branco continua branco sobre fundos coloridos */
html[data-tema="claro"] :is(.bg-blue-600,.bg-gradient-to-br,.bg-gradient-to-r,.bg-black\/80,[class*="bg-red-6"],[class*="bg-emerald-6"],[class*="bg-orange-5"],[class*="bg-violet-6"],[class*="bg-purple-6"],.estudio-btn),html[data-tema="claro"] :is(.bg-blue-600,.bg-gradient-to-br,.bg-gradient-to-r,.bg-black\/80,[class*="bg-red-6"],[class*="bg-emerald-6"],[class*="bg-orange-5"],[class*="bg-violet-6"],[class*="bg-purple-6"]) .text-white{color:#fff!important}
html[data-tema="claro"] .from-violet-600{--tw-gradient-from:#e8461a var(--tw-gradient-from-position)!important}html[data-tema="claro"] .to-blue-600{--tw-gradient-to:#ff8a3d var(--tw-gradient-to-position)!important}
html[data-tema="claro"] .estudio-btn{background:linear-gradient(135deg,#e8461a,#ff6b3d)}
</style>
<script>
(function(){ const set=t=>document.documentElement.dataset.tema=(t==="escuro"?"escuro":"claro");
  try{ set(localStorage.getItem("tema")); }catch(e){ set("claro"); }
  window.addEventListener("message", e=>{ if(e.origin===location.origin && e.data && e.data.type==="estudio:tema") set(e.data.tema); });
  window.addEventListener("storage", e=>{ if(e.key==="tema") set(e.newValue); });
})();
</script>
</head>
<body class="bg-gray-950 text-gray-100">

<!-- ===== SENHA ===== -->
<div id="senha-screen" class="fixed inset-0 bg-gray-950 flex items-center justify-center z-50 p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl p-8 w-full max-w-sm fade-in">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center font-bold text-lg">RS</div>
      <div><p class="font-bold">Dashboard • Redes Sociais</p><p class="text-gray-500 text-xs">Painel interno</p></div>
    </div>
    <label class="block text-xs text-gray-400 mb-2 font-semibold uppercase tracking-wider">Senha de acesso</label>
    <div class="relative mb-3">
      <input id="inp-senha" type="password" placeholder="••••••••••••••••"
        class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 pr-10 text-sm focus:outline-none focus:border-blue-500 text-white"
        onkeydown="if(event.key==='Enter')verificarSenha()">
      <button onclick="document.getElementById('inp-senha').type=document.getElementById('inp-senha').type==='password'?'text':'password'" class="absolute right-3 top-3 text-gray-500 hover:text-white text-sm"><i class="fa-solid fa-eye"></i></button>
    </div>
    <div id="senha-err" class="hidden text-red-400 text-xs mb-3 bg-red-950 border border-red-900 rounded-xl px-3 py-2">Senha incorreta.</div>
    <button onclick="verificarSenha()" class="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-2xl py-3 text-sm font-semibold transition-colors">Entrar →</button>
  </div>
</div>

<!-- ===== LOADING ===== -->
<div id="loading-screen" class="hidden fixed inset-0 bg-gray-950 flex flex-col items-center justify-center z-50 gap-4">
  <div class="w-10 h-10 border-4 border-gray-800 border-t-blue-500 rounded-full spin"></div>
  <p class="text-gray-400 text-sm" id="loading-msg">Carregando...</p>
</div>

<!-- ===== MODAL CARD TRELLO ===== -->
<div id="modal-card" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[9999] p-4" onclick="if(event.target===this)fecharModalCard()">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-lg max-h-[90vh] overflow-auto fade-in">
    <div class="p-6">
      <div class="flex justify-between items-start mb-4">
        <div id="mc-labels" class="flex flex-wrap gap-2"></div>
        <button onclick="fecharModalCard()" class="text-gray-500 hover:text-white w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800 text-xl flex-shrink-0 ml-2">×</button>
      </div>
      <h3 id="mc-titulo" class="text-base font-bold mb-5 leading-snug"></h3>
      <div class="space-y-2 text-sm" id="mc-infos"></div>
      <div id="mc-desc-wrap" class="hidden mt-4">
        <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-2">Descrição</p>
        <p id="mc-desc" class="text-gray-300 text-sm leading-relaxed bg-gray-800 rounded-xl p-4 whitespace-pre-wrap"></p>
      </div>
      <div id="mc-link-wrap" class="hidden"></div>
    </div>
  </div>
</div>

<!-- ===== MODAL POST PLANILHA ===== -->
<div id="modal-post" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onclick="if(event.target===this)fecharModalPost()">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-md fade-in">
    <div class="p-6">
      <div class="flex justify-between items-start mb-4">
        <div id="mp-badge" class="text-xs px-3 py-1 rounded-full font-semibold"></div>
        <button onclick="fecharModalPost()" class="text-gray-500 hover:text-white w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800 text-xl ml-2">×</button>
      </div>
      <h3 id="mp-titulo" class="text-base font-bold mb-5 leading-snug"></h3>
      <div class="space-y-2">
        <div class="flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-3 text-sm"><i class="fa-solid fa-calendar-day text-blue-400 w-4 text-center"></i><span id="mp-data"></span></div>
        <div class="flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-3 text-sm"><i class="fa-solid fa-clock text-amber-400 w-4 text-center"></i><span id="mp-hora"></span></div>
        <div class="flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-3 text-sm"><i class="fa-solid fa-table-cells text-purple-400 w-4 text-center"></i><span id="mp-aba" class="text-gray-400"></span></div>
      </div>
      <a href="https://docs.google.com/spreadsheets/d/1lbDiarWjQ7Xk6HmsFDhafnra-cG-KyssYkzF7YX4qj4" target="_blank"
        class="mt-4 w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl py-3 text-sm transition-colors">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Ver na planilha
      </a>
    </div>
  </div>
</div>

<!-- ===== MODAL MEMBRO ===== -->
<div id="modal-membro" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onclick="if(event.target===this)fecharModalMembro()">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-auto fade-in">
    <div class="p-6">
      <div class="flex justify-between items-start mb-4">
        <div><h3 id="mm-nome" class="text-xl font-bold"></h3><p id="mm-sub" class="text-gray-400 text-sm mt-1"></p></div>
        <button onclick="fecharModalMembro()" class="text-gray-500 hover:text-white w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800 text-xl flex-shrink-0 ml-4">×</button>
      </div>
      <div class="grid grid-cols-3 gap-3 mb-5" id="mm-stats"></div>
      <div class="flex flex-wrap gap-2 mb-4">
        <select id="mm-periodo" onchange="renderModalMembro()" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
          <option value="all">Todos</option><option value="week">Esta semana</option>
          <option value="month">Este mês</option><option value="year">Este ano</option>
        </select>
        <select id="mm-prog" onchange="renderModalMembro()" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none flex-1 min-w-0"></select>
      </div>
      <div id="mm-cards" class="space-y-2"></div>
    </div>
  </div>
</div>

<!-- ===== SIDEBAR OVERLAY MOBILE ===== -->
<div id="sb-overlay" class="hidden fixed inset-0 bg-black/60 z-30" onclick="fecharSidebar()"></div>

<!-- ===== APP ===== -->
<div id="app" class="hidden flex-col" style="min-height:100vh">

  <!-- HEADER MOBILE -->
  <header class="flex md:hidden bg-gray-900 border-b border-gray-800 sticky top-0 z-20 flex-col">
    <!-- Brand switcher -->
    <div class="flex items-center gap-1 px-3 pt-2 pb-1">
      <button onclick="toggleSidebar()" class="w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-800 text-gray-400 flex-shrink-0 mr-1"><i class="fa-solid fa-bars"></i></button>
      <button onclick="switchBrand('gnt')" id="bb-m-gnt" class="brand-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all border border-transparent">
        <span class="w-5 h-5 bg-blue-600 rounded-md flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0">G</span>
        <span class="hidden xs:inline">GNT</span>
      </button>
      <button onclick="switchBrand('globoplay')" id="bb-m-globoplay" class="brand-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all border border-transparent">
        <span class="w-5 h-5 bg-gradient-to-br from-orange-500 to-red-600 rounded-md flex items-center justify-center text-white flex-shrink-0"><i class="fa-solid fa-play text-[8px]"></i></span>
        <span class="hidden xs:inline">Globoplay</span>
      </button>
      <button onclick="switchBrand('telecine')" id="bb-m-telecine" class="brand-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all border border-transparent">
        <span class="w-5 h-5 bg-gradient-to-br from-purple-600 to-indigo-700 rounded-md flex items-center justify-center text-white flex-shrink-0"><i class="fa-solid fa-film text-[8px]"></i></span>
        <span class="hidden xs:inline">Telecine</span>
      </button>
      <select id="fp-m" onchange="ST.fp=this.value;renderView()" class="ml-auto bg-gray-800 border border-gray-700 rounded-xl px-2 py-1.5 text-xs text-white focus:outline-none max-w-[110px]"><option value="">Todos progs.</option></select>
    </div>
    <div class="flex items-center gap-2 px-4 pb-2.5">
      <div class="flex bg-gray-800 border border-gray-700 rounded-xl overflow-hidden text-xs">
        <button data-p="dia" onclick="setPeriodo('dia',this)" class="pbt px-2.5 py-1.5 text-gray-400 hover:text-white">Dia</button>
        <button data-p="semana" onclick="setPeriodo('semana',this)" class="pbt px-2.5 py-1.5 text-gray-400 hover:text-white">Sem</button>
        <button data-p="mes" onclick="setPeriodo('mes',this)" class="pbt px-2.5 py-1.5 text-gray-400 hover:text-white">Mês</button>
        <button data-p="ano" onclick="setPeriodo('ano',this)" class="pbt px-2.5 py-1.5 bg-blue-600 text-white">Ano</button>
      </div>
      <button onclick="shiftP(-1)" class="w-7 h-7 flex items-center justify-center bg-gray-800 border border-gray-700 rounded-lg text-gray-400">‹</button>
      <span id="plbl-m" class="text-xs text-gray-400 flex-1 text-center"></span>
      <button onclick="shiftP(1)" class="w-7 h-7 flex items-center justify-center bg-gray-800 border border-gray-700 rounded-lg text-gray-400">›</button>
    </div>
  </header>

  <!-- HEADER DESKTOP -->
  <header class="hidden md:flex bg-gray-900 border-b border-gray-800 sticky top-0 z-20 items-center gap-3 px-5 py-2.5 flex-wrap">
    <!-- Brand switcher -->
    <div class="flex items-center bg-gray-800/60 border border-gray-700/60 rounded-2xl p-1 gap-1 flex-shrink-0">
      <button onclick="switchBrand('gnt')" id="bb-d-gnt" class="brand-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold transition-all">
        <span class="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center text-[11px] font-bold text-white flex-shrink-0">G</span>
        GNT
      </button>
      <button onclick="switchBrand('globoplay')" id="bb-d-globoplay" class="brand-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold transition-all">
        <span class="w-6 h-6 bg-gradient-to-br from-orange-500 to-red-600 rounded-lg flex items-center justify-center text-white flex-shrink-0"><i class="fa-solid fa-play text-[9px]"></i></span>
        Globoplay
      </button>
      <button onclick="switchBrand('telecine')" id="bb-d-telecine" class="brand-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold transition-all">
        <span class="w-6 h-6 bg-gradient-to-br from-purple-600 to-indigo-700 rounded-lg flex items-center justify-center text-white flex-shrink-0"><i class="fa-solid fa-film text-[9px]"></i></span>
        Telecine
      </button>

function csvRows(txt){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"')q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch!=='\r')cur+=ch; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function cronoParseData(v){
  if(!v) return null;
  v=String(v).trim();
  let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);       // DD/MM/AAAA (ou MM/DD/AAAA se o Sheets exportar em EN)
  if(m){
    let d=+m[1],mo=+m[2];
    if(d>12&&mo<=12){/* já é DD/MM */}
    else if(mo>12&&d<=12){const t=d;d=mo;mo=t;}   // veio MM/DD: inverte
    return `${m[3]}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);                 // AAAA-MM-DD
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=v.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);                // DD-MM-AAAA
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  m=v.match(/^(\d{1,2})\/(\d{1,2})$/);                       // DD/MM (assume 2026)
  if(m) return `2026-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d=new Date(v);                                        // fallback (formato longo do Sheets)
  if(!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return null;
}

function cronoParseRows(rows){
  const notas=[];
  rows.forEach((row,i)=>{
    const nome=(row[0]||'').trim();
    if(!nome) return;
    const l=normTxt(nome);
    if(l==='nome'||(i===0&&l.includes('nome'))) return;   // cabeçalho
    if(l.startsWith('como preencher')) return;            // legenda
    const inicio=cronoParseData(row[1]);
    const fim=cronoParseData(row[2]);
    const desc=(row[3]||'').trim();
    notas.push({id:'c'+i,nome,inicio,fim,desc});
  });
  return notas;
}

// Diagnóstico visível: guarda de onde veio o dado, quantas linhas e a hora
async function fetchCrono(force){
  if(ST.crono&&!force) return ST.crono;
  const cb='cb='+Date.now();                              // evita cache do navegador
  const pub=cronoPubURL();
  const tentativas=[];
  if(pub) tentativas.push({nome:'Publicado na web',url:pub+(pub.includes('?')?'&':'?')+cb});
  tentativas.push({nome:'gviz CSV',url:`https://docs.google.com/spreadsheets/d/${CRONO_SHEET}/gviz/tq?tqx=out:csv&`+cb});
  tentativas.push({nome:'export CSV',url:`https://docs.google.com/spreadsheets/d/${CRONO_SHEET}/export?format=csv&`+cb});

  const falhas=[];
  for(const t of tentativas){
    try{
      const r=await fetch(t.url,{mode:'cors',cache:'no-store'});
      if(!r.ok){falhas.push(`${t.nome}: HTTP ${r.status}`);continue;}
      const txt=await r.text();
      if(!txt||txt.trim().startsWith('<')){falhas.push(`${t.nome}: veio HTML (sem permissão de leitura)`);continue;}
      const notas=cronoParseRows(csvRows(txt));
      ST.crono=notas;
      ST.cronoErro=null;
      ST.cronoInfo={fonte:t.nome,linhas:notas.length,ausencias:notas.filter(n=>n.inicio&&n.fim).length,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})};
      return notas;
    }catch(e){falhas.push(`${t.nome}: ${e.message||'bloqueado pelo navegador (CORS)'}`);}
  }
  ST.cronoErro='Não consegui ler a planilha. Tentativas: '+falhas.join(' · ');
  ST.cronoInfo=null;
  if(!ST.crono) ST.crono=[];
  return ST.crono;
}

function trocarLinkCrono(){
  const atual=cronoPubURL();
  const u=prompt('Cole a URL publicada na web da planilha (Arquivo > Compartilhar > Publicar na web > CSV).\n\nDeixe em branco e confirme para voltar ao link padrão.',atual);
  if(u===null) return;
  setCronoPubURL(u.trim());
  ST.cronoLoading=true;renderView();

}

// ===== API usada pelo resto do painel (badges, membros, IA, Análise Mensal) =====
// Só contam como ausência as linhas com saída E retorno preenchidos
function getNotas(){ return (ST.crono||[]).filter(n=>n.inicio&&n.fim); }

function notaInicio(n){const[y,m,d]=n.inicio.split('-').map(Number);return new Date(y,m-1,d,0,0,0,0);}
function notaFim(n){const[y,m,d]=n.fim.split('-').map(Number);return new Date(y,m-1,d,23,59,59,999);}
function notaLabel(n){
  const f=d=>{const[y,m,dd]=d.split('-');return`${dd}/${m}`;};
  return `${n.desc||'Ausência'} (${f(n.inicio)} a ${f(n.fim)})`;
}

// Notas de uma pessoa (match por nome normalizado)
function notasDe(nome){
  const nn=normTxt(nome);
  return getNotas().filter(n=>{
    const nx=normTxt(n.nome);
    return nn.includes(nx)||nx.includes(nn)||nn.split(' ')[0]===nx.split(' ')[0];
  });
}

// Notas de uma pessoa ativas no range atual (ou todas, se forçado)
function notasAtivas(nome, force){
  const notas=notasDe(nome);
  if(!notas.length) return [];
  if(force) return notas;
  const{s,e}=getRange();
  return notas.filter(n=>s<=notaFim(n) && e>=notaInicio(n));
}

// Retorna o nome com as notas (férias / atendimentos) aplicáveis ao contexto
function nomeComFerias(nome, force){
  const ativas=notasAtivas(nome, force);
  if(!ativas.length) return esc(nome);
  const badges=ativas.map(n=>`<span class="text-[10px] text-blue-300 bg-blue-900/40 border border-blue-700/40 px-1.5 py-0.5 rounded-full font-normal">${esc(notaLabel(n))}</span>`).join(' ');
  return `${esc(nome)} ${badges}`;
}

async function req(path){
  const url=`https://api.trello.com/1${path}${path.includes('?')?'&':'?'}key=${KEY}&token=${TOKEN}`;
  let r; try{r=await fetch(url,{headers:{Accept:'application/json'}});}
  catch(e){throw new Error('Rede: '+e.message);}
  if(r.status===401) throw new Error('Token inválido');
  if(r.status===404) throw new Error('Board não encontrado');
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// Busca TODOS os cards do board (incluindo arquivados), com paginação.
// A API do Trello limita cada requisição a 1000 cards e, por padrão,
// só retorna cards abertos — por isso cards antigos/arquivados sumiam.
async function fetchAllCardsFor(boardId){
  const F='name,desc,due,idList,idMembers,labels,closed';
  const seen=new Set(); const all=[];
  const add=b=>{for(const c of b){if(!seen.has(c.id)){seen.add(c.id);all.push(c);}}};
  const minOf=b=>b.reduce((m,c)=>c.id<m?c.id:m,b[0].id);
  const maxOf=b=>b.reduce((m,c)=>c.id>m?c.id:m,b[0].id);

  let batch=await req(`/boards/${boardId}/cards/all?fields=${F}&limit=1000`);
  add(batch);

  if(batch.length>=1000){
    // Pagina para trás (cards mais antigos)
    let minId=minOf(batch);
    for(let i=0;i<30;i++){
      const b=await req(`/boards/${boardId}/cards/all?fields=${F}&limit=1000&before=${minId}`);
      if(!b.length) break;
      add(b);
      const nm=minOf(b);
      if(nm===minId) break;
      minId=nm;
      if(b.length<1000) break;
    }
    // Pagina para frente (cards mais novos)
    let maxId=maxOf(batch);
    for(let i=0;i<30;i++){
      const b=await req(`/boards/${boardId}/cards/all?fields=${F}&limit=1000&since=${maxId}`);
      if(!b.length) break;
      add(b);
      const nx=maxOf(b);
      if(nx===maxId) break;
      maxId=nx;
      if(b.length<1000) break;
    }
  }
  return all;
}
async function fetchAllCards(){return fetchAllCardsFor(BOARD);}

// ============================================================
// GOOGLE SHEETS — fetch CSV (funciona em qualquer host)
// ============================================================
async function fetchSheet(tab){
  if(!SHEET) return null;
  if(ST.sc[tab]!==undefined) return ST.sc[tab];
  // Tenta CSV export (público, sem auth)
  const urls=[
    `https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`,
    `https://docs.google.com/spreadsheets/d/${SHEET}/export?format=csv&sheet=${encodeURIComponent(tab)}`,
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{mode:'cors'});
      if(!r.ok) continue;
      const txt=await r.text();
      if(!txt||txt.trim().startsWith('<')) continue; // retornou HTML = erro
      const posts=parseCSV2(txt,tab);
      ST.sc[tab]=posts;
      return posts;
    }catch(e){continue;}
  }
  // JSONP fallback
  return new Promise(resolve=>{
    const cb='gnt_cb_'+Date.now();
    const s=document.createElement('script');
    const to=setTimeout(()=>{cleanup();ST.sc[tab]=null;resolve(null);},10000);
    window[cb]=(data)=>{cleanup();const posts=parseGviz(data,tab);ST.sc[tab]=posts;resolve(posts);};
    function cleanup(){clearTimeout(to);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    s.onerror=()=>{cleanup();ST.sc[tab]=null;resolve(null);};
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:json;handler=${cb}&sheet=${encodeURIComponent(tab)}`;
    document.head.appendChild(s);
  });
}

function parseCSV2(text, tab){
  // Parser CSV robusto
  const rows=[];let row=[],cell='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(inQ&&text[i+1]==='"'){cell+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){row.push(cell);cell='';}
    else if((c==='\n'||c==='\r')&&!inQ){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  
  const posts=[];
  // Encontra blocos "Horários" (cada um = uma semana)
  for(let i=0;i<rows.length;i++){
    const lbl=(rows[i][0]||'').trim().toLowerCase();
    if(!lbl.includes('horário')&&!lbl.includes('horario')) continue;
    // Mapeia colunas → datas (linha de horários tem as datas nas células)
    const colDates=[];
    for(let col=0;col<rows[i].length;col++){
      const cell=(rows[i][col]||'').trim();
      const m=cell.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m){
        const d=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
        if(d>=MIN) colDates.push({col,date:d});
      }
    }
    if(!colDates.length) continue;
    // Lê linhas de conteúdo até achar outro bloco Horários
    for(let row=i+1;row<rows.length;row++){
      const tc=(rows[row][0]||'').trim();
      if(tc.toLowerCase().includes('horário')||tc.toLowerCase().includes('horario')) break;
      if(!/^\d{1,2}:\d{2}$/.test(tc)) continue;
      for(const {col,date} of colDates){
        const content=(rows[row][col]||'').trim().replace(/^[`\'\s]+/,'');
        if(content) posts.push({
          date,time:tc,title:content,rede:tab,
          dateStr:date.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})
        });
      }
    }
  }
  return posts;
}

function parseGviz(data, tab){
  // data = Google Visualization Query response
  try {
    const table = data.table;
    if(!table||!table.rows) return [];
    const cols = table.cols||[];
    const rows = table.rows||[];
    // Find columns that are dates (type 'date') and time column (first col pattern HH:MM)
    // The sheet structure: col0=time, then various cols with dates as headers
    // We'll look at the labels for date patterns
    const dateCols = [];
    cols.forEach((col,i)=>{
      if(!col.label) return;
      const lbl = String(col.label).trim();
      const m = lbl.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m){
        const d=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
        if(d>=MIN) dateCols.push({i,date:d});
      }
    });
    if(!dateCols.length) return [];
    const posts=[];
    rows.forEach(row=>{
      const cells=row.c||[];
      const timeCell=cells[0]&&cells[0].v?String(cells[0].v).trim():'';
      if(!/^\d{1,2}:\d{2}$/.test(timeCell)) return;
      dateCols.forEach(({i,date})=>{
        const cell=cells[i];
        const content=cell&&cell.v?String(cell.v).trim().replace(/^[`' ]+/,''):'';
        if(content) posts.push({
          date, time:timeCell, title:content, rede:tab,
          dateStr:date.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})
        });
      });
    });
    return posts;
  } catch(e){ return []; }
}

function normNome(nome){
  if(!nome) return '—';
  const l=nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const DEDUP=getDEDUP();
  for(const g of DEDUP){
    if(g.t.every(t=>l.includes(t))) return g.c;
    if(g.t.length===1&&(l===g.t[0]||l.startsWith(g.t[0]+' '))) return g.c;
  }
  return nome.trim();
}
function mNome(id){const m=ST.members.find(x=>x.id===id);return normNome(m?m.fullName||m.username:'—');}
function ini(n){return n.split(' ').slice(0,2).map(x=>x[0]||'').join('').toUpperCase();}
function lNome(id){const l=ST.lists.find(x=>x.id===id);return l?l.name:'—';}

function detectRede(card){
  for(const lbl of (card.labels||[])){
    const n=(lbl.name||'').toLowerCase().trim();
    if(REDE_EXACT[n]) return REDE_EXACT[n];
    for(const [r,ks] of Object.entries(RKW))if(ks.some(k=>n.includes(k)))return r;
  }
  const t=(card.name+' '+(card.desc||'')).toLowerCase();
  for(const [r,ks] of Object.entries(RKW))if(ks.some(k=>t.includes(k)))return r;
  return null;
}
function progs(card){
  return(card.labels||[]).filter(l=>{
    const n=(l.name||'').toLowerCase().trim();
    if(REDE_EXACT[n]) return false;
    return!Object.values(RKW).flat().some(k=>n.includes(k));
  }).map(l=>l.name||l.color||'').filter(Boolean);
}
function dCard(card){
  // 1º: due date do Trello (data de entrega — fonte principal)
  if(card.due) return new Date(card.due);
  // 2º: data explícita no título dd/mm/yyyy (com 4 dígitos no ano, >= 2026)
  const m=(card.name||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){
    const d=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
    if(d>=MIN) return d;
  }
  // Sem due date e sem data válida → null (card excluído dos gráficos)
  return null;
}
// Extrai data de criação do card pelo ID (MongoDB ObjectID — primeiros 8 hex = unix timestamp)
function cardCriadoEm(card){
  try{ return new Date(parseInt(card.id.substring(0,8),16)*1000); }
  catch(e){ return null; }
}

// Data extraída do TÍTULO do card (ex: "02/04", "Prog 03/04", "03/04/2026")
// Usada na aba Agendamento. Usa o ANO DE CRIAÇÃO do card para evitar que
// cards antigos de 2025 com "dd/mm" no título virem datas futuras de 2026.
function dCardTitulo(card){
  const txt = card.name || '';
  // Prioridade: dd/mm/yyyy com ano completo
  const m4 = txt.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m4){
    const d=new Date(parseInt(m4[3]),parseInt(m4[2])-1,parseInt(m4[1]));
    if(d>=MIN) return d;
    return null;
  }
  // Fallback: dd/mm sem ano — usa o ano de criação do card para inferir
  const m2 = txt.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
  if(m2){
    const dia=parseInt(m2[1]), mes=parseInt(m2[2]);
    if(mes>=1&&mes<=12&&dia>=1&&dia<=31){
      const criado = cardCriadoEm(card);
      const anoCriacao = criado ? criado.getFullYear() : new Date().getFullYear();
      const d = new Date(anoCriacao, mes-1, dia);
      if(d>=MIN) return d;
      // Se com o ano de criação ficou antes do MIN, tenta ano seguinte
      // (ex: card criado em dez/2025 com data "15/01" = jan/2026)
      const dNext = new Date(anoCriacao+1, mes-1, dia);
      if(dNext>=MIN && dNext<=new Date(anoCriacao+1,11,31)) return dNext;
    }
  }
  return null;
}

function isDecupagem(card){
  if((card.labels||[]).some(l=>(l.name||'').toLowerCase().includes('decupagem'))) return true;
  const ln=(lNome(card.idList)||'').toLowerCase();
  return ln.includes('decupagem');
}

// Detecta se card tem label "ajuste" (qualquer variação)
function isAjuste(card){
  return (card.labels||[]).some(l=>(l.name||'').toLowerCase().includes('ajuste'));
}

function hCard(card){
  if(card.due){const d=new Date(card.due);if(d.getHours()||d.getMinutes())return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
  const m=(card.name+' '+(card.desc||'')).match(/(\d{1,2})[h:](\d{2})?/i);
  return m?`${String(m[1]).padStart(2,'0')}:${m[2]||'00'}`:null;
}
function todosProgs(){const s=new Set();ST.cards.forEach(c=>progs(c).forEach(p=>s.add(p)));return[...s].sort();}

function getRange(){
  const now=new Date(),o=ST.offset;
  if(ST.periodo==='dia'){
    const d=new Date(now);d.setDate(d.getDate()+o);
    const s=new Date(d);s.setHours(0,0,0,0);const e=new Date(d);e.setHours(23,59,59,999);return{s,e};
  }
  if(ST.periodo==='semana'){
    const d=new Date(now);d.setDate(d.getDate()-d.getDay()+1+o*7);
    const s=new Date(d);s.setHours(0,0,0,0);const e=new Date(s);e.setDate(s.getDate()+6);e.setHours(23,59,59,999);return{s,e};
  }
  if(ST.periodo==='mes'){
    const d=new Date(now.getFullYear(),now.getMonth()+o,1);
    const s=new Date(d);s.setHours(0,0,0,0);const e=new Date(d.getFullYear(),d.getMonth()+1,0);e.setHours(23,59,59,999);return{s,e};
  }
  const y=now.getFullYear()+o;return{s:new Date(y,0,1,0,0,0,0),e:new Date(y,11,31,23,59,59,999)};
}
function filtP(cards){const{s,e}=getRange();return(cards||ST.cards).filter(c=>{const d=dCard(c);return d&&d>=s&&d<=e;});}
function filt(cards){
  let r=filtP(cards||ST.cards);
  if(ST.fp) r=r.filter(c=>progs(c).includes(ST.fp));
  return r;
}

// Dedup membros: conta cada card UMA VEZ por nome canonical
// Se um card tem "Alan Barros" e "Alan Matos de Barros", conta 1, não 2
function dedupM(cards){
  const map={};
  cards.forEach(c=>{
    // Nomes canonicals únicos presentes neste card
    const canonicals=new Set((c.idMembers||[]).map(id=>mNome(id)));
    canonicals.forEach(nome=>{
      if(!map[nome])map[nome]={ids:new Set(),count:0};
      (c.idMembers||[]).filter(id=>mNome(id)===nome).forEach(id=>map[nome].ids.add(id));
      map[nome].count++; // conta o card 1x por canonical
    });
  });
  return Object.entries(map).sort((a,b)=>b[1].count-a[1].count);
}
function idsGrupo(nome){return ST.members.filter(m=>normNome(m.fullName||m.username)===nome).map(m=>m.id);}

function semana(off){
  const now=new Date(),d=new Date(now);d.setDate(d.getDate()-d.getDay()+1+(off||0)*7);
  const s=new Date(d);s.setHours(0,0,0,0);
  const days=[];for(let i=0;i<7;i++){const dd=new Date(s);dd.setDate(s.getDate()+i);days.push(dd);}
  return{s,days};
}
function fmtD(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}
function dc(id){if(ST.charts[id]){ST.charts[id].destroy();delete ST.charts[id];}}

function updLabel(){
  const{s,e}=getRange();
  let lbl='';
  if(ST.periodo==='dia') lbl=s.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  else if(ST.periodo==='semana') lbl=`${fmtD(s)} – ${fmtD(e)}`;
  else if(ST.periodo==='mes') lbl=s.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  else lbl=String(s.getFullYear());
  ['plbl-d','plbl-m'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=lbl;});
}

function setView(v){

  ST.view=v;
  if(trocouAba){

    ST.fp='';

function renderView(){
  Object.keys(ST.charts).forEach(id=>dc(id));
  const mc=document.getElementById('mc');
  const b=BRANDS[CURRENT_BRAND];
  if(ST.view==='calendario' && !b.hasAgendamento){ST.view='dashboard';}
  if(ST.view==='redes'){ST.view='formatos';}
  if(ST.view==='dashboard') renderDash(mc);
  else if(ST.view==='membros') renderMembros(mc);

  else if(ST.view==='status') renderStatus(mc);
  else if(ST.view==='mix') renderMix(mc);

  else if(ST.view==='calendario') renderAgendamento(mc);
  else if(ST.view==='ajustes') renderAjustes(mc);
  else if(ST.view==='posts') renderPosts(mc);
  else if(ST.view==='comparativo') renderComparativo(mc);
  else if(ST.view==='notas') renderNotas(mc);
  else if(ST.view==='adm') renderAdm(mc);

}

function corLabel(color){
  const map={red:'#ef4444',orange:'#f97316',yellow:'#eab308',green:'#22c55e',
    blue:'#3b82f6',purple:'#a855f7',pink:'#ec4899',sky:'#0ea5e9',lime:'#84cc16',
    teal:'#14b8a6',black:'#6b7280',null:'#6b7280'};
  return map[color]||'#6b7280';
}

function abrirMembro(id){
  ST.mmId=id;
  const nome=mNome(id), ids=idsGrupo(nome);
  document.getElementById('mm-nome').innerHTML=nomeComFerias(nome, true);
  const todos=ST.cards.filter(c=>ids.some(x=>(c.idMembers||[]).includes(x)));
  const now=new Date();
  const wS=new Date(now);wS.setDate(wS.getDate()-wS.getDay()+1);wS.setHours(0,0,0,0);
  const wE=new Date(wS);wE.setDate(wS.getDate()+6);wE.setHours(23,59,59,999);
  const mS=new Date(now.getFullYear(),now.getMonth(),1,0,0,0,0);
  const mE=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59,999);
  const yS=new Date(now.getFullYear(),0,1,0,0,0,0);
  const yE=new Date(now.getFullYear(),11,31,23,59,59,999);
  const tw=todos.filter(c=>{const d=dCard(c);return d&&d>=wS&&d<=wE;}).length;
  const tm=todos.filter(c=>{const d=dCard(c);return d&&d>=mS&&d<=mE;}).length;

  const ps=new Set();todos.forEach(c=>progs(c).forEach(p=>ps.add(p)));

    <div class="bg-gray-800 rounded-xl p-3 text-center"><p class="text-xs text-gray-400 mb-1">Ano</p><p class="text-2xl font-bold text-amber-400">${ty}</p></div>`;

  document.getElementById('mm-prog').innerHTML=po;

}

function renderDash(mc){
  const cards=filt();
  const{s,e}=getRange();
  const dedup=dedupM(cards);
  const pC={};cards.forEach(c=>pautasDoCard(c).forEach(p=>{pC[p]=(pC[p]||0)+1;}));
  const nC={instagram:0,tiktok:0,facebook:0,youtube:0};
  cards.forEach(c=>{const n=detectRede(c);if(n&&n in nC)nC[n]++;});

  // Total de Produções no período = cards com due date dentro do range
  const totalProd=filtP(ST.cards.filter(c=>dCard(c)!==null)).filter(c=>!ST.fp||progs(c).includes(ST.fp)).length;

  let bL=[],bD=[];

    while(ws<=e){const we=new Date(ws);we.setDate(ws.getDate()+6);if(we>e)we.setTime(e.getTime());
      bL.push(`Sem ${wi++}`);bD.push(ST.cards.filter(c=>{const d=dCard(c);return d&&d>=ws&&d<=we;}).length);ws.setDate(ws.getDate()+7);}
  }else{
    ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'].forEach((m,i)=>{
      const ms=new Date(s.getFullYear(),i,1),me=new Date(s.getFullYear(),i+1,0,23,59,59,999);
      bL.push(m);bD.push(ST.cards.filter(c=>{const d=dCard(c);return d&&d>=ms&&d<=me;}).length);});
  }
  const tP=Object.entries(pC).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const tM=dedup.slice(0,6);

  mc.innerHTML=`<div class="fade-in max-w-5xl mx-auto">
    <h2 class="text-xl md:text-2xl font-bold mb-1">Dashboard</h2>
    <p class="text-gray-500 text-sm mb-5">Visão geral do período</p>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-5">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 ch">
        <p class="text-gray-400 text-xs uppercase tracking-wider mb-2">Posts no período</p>
        <p class="text-3xl md:text-4xl font-bold text-blue-400">${cards.length}</p>
        <p class="text-gray-600 text-xs mt-1">cards com data identificada</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 ch group relative">
        <div class="flex items-center justify-between mb-2">
          <p class="text-gray-400 text-xs uppercase tracking-wider">Total no Board</p>
          <div class="relative">
            <i class="fa-solid fa-circle-info text-gray-600 hover:text-gray-400 text-xs cursor-pointer transition-colors peer"></i>
            <div class="absolute right-0 top-5 w-56 bg-gray-800 border border-gray-700 rounded-xl p-3 text-xs text-gray-300 leading-relaxed shadow-xl z-10 hidden peer-hover:block">
              <p class="font-semibold text-white mb-1">Por que esse número é maior?</p>
              <p>Conta <strong>todos</strong> os cards do board desde jan/2026 — inclusive os sem data de entrega definida e os com data só no título. Os outros dois quadros só contam cards <strong>com due date</strong> dentro do período filtrado.</p>
            </div>
          </div>
        </div>
        <p class="text-3xl md:text-4xl font-bold text-emerald-400">${ST.cards.length}</p>
        <p class="text-gray-600 text-xs mt-1">total bruto · inclui cards sem data</p>
      </div>
      <div class="col-span-2 md:col-span-1 bg-gray-900 border border-orange-900/50 rounded-2xl p-4 ch cursor-pointer hover:border-orange-600 transition-colors" onclick="setView('producao')">
        <div class="flex items-center justify-between mb-2">
          <p class="text-gray-400 text-xs uppercase tracking-wider">Total de Produções</p>
          <i class="fa-solid fa-circle-dot text-orange-400 text-xs"></i>
        </div>
        <p class="text-3xl md:text-4xl font-bold text-orange-400">${totalProd}</p>
        <p class="text-gray-600 text-xs mt-1">com data de entrega · <span class="text-orange-700">ver tudo →</span></p>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
      <div class="md:col-span-2 bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <p class="font-semibold text-sm mb-1">Posts por ${ST.periodo==='dia'?'hora':ST.periodo==='semana'?'dia':ST.periodo==='mes'?'semana':'mês'}</p>
        <p class="text-gray-500 text-xs mb-4">Distribuição no período</p>
        <div style="height:170px"><canvas id="ch-bar"></canvas></div>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <p class="font-semibold text-sm mb-1">Por rede social</p>
        <p class="text-gray-500 text-xs mb-3">Plataformas</p>
        <div style="height:170px"><canvas id="ch-do"></canvas></div>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <p class="font-semibold text-sm mb-1">Top pautas entregues</p>
        <p class="text-gray-500 text-xs mb-4">Somente formatos, sem status ou ajustes</p>
        ${tP.length?tP.map(([p,n],i)=>`<div class="flex items-center gap-2 mb-3">
          <span class="text-gray-600 text-xs w-4 flex-shrink-0">${i+1}</span>
          <span class="text-sm flex-1 truncate">${esc(p)}</span>
          <div class="w-16 h-1.5 bg-gray-800 rounded-full overflow-hidden flex-shrink-0"><div class="h-full bg-purple-500 rounded-full" style="width:${Math.round(n/tP[0][1]*100)}%"></div></div>
          <span class="text-purple-400 font-bold text-xs w-6 text-right flex-shrink-0">${n}</span>
        </div>`).join(''):'<p class="text-gray-600 text-sm">Nenhuma pauta identificada</p>'}
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <p class="font-semibold text-sm mb-4">Membros mais demandados</p>
        ${tM.length?tM.map(([nome,info],i)=>`<div class="flex items-center gap-2 mb-3 cursor-pointer hover:opacity-80" onclick="abrirMembro('${esc([...info.ids][0])}')">

  setTimeout(()=>{
    dc('ch-bar');

      type:'bar',

    const nets=Object.entries(nC).filter(([,v])=>v>0);
    if(nets.length){
      dc('ch-do');
      ST.charts['ch-do']=new Chart(document.getElementById('ch-do'),{
        type:'doughnut',
        data:{labels:nets.map(([k])=>REDES[k].label),
              datasets:[{data:nets.map(([,v])=>v),

                borderColor:nets.map(([k])=>COR[k]),
                borderWidth:2,hoverOffset:8}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'60%',
          plugins:{legend:{position:'right',labels:{color:'#9ca3af',font:{size:11},padding:8,usePointStyle:true,pointStyleWidth:8}}}}

}

// ============================================================
// ATIVIDADE DO DIA — movimentações de cards (Trello actions)
// ============================================================
function acaoNome(a){return normNome(a.memberCreator?(a.memberCreator.fullName||a.memberCreator.username):'—');}

function renderAtividadeDia(s,e){
  const acts=(ST.actions||[]).filter(a=>{
    const d=new Date(a.date); return d>=s&&d<=e;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  // Ranking de participação ativa
  const rank={};
  acts.forEach(a=>{const n=acaoNome(a);rank[n]=(rank[n]||0)+1;});
  const rankArr=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Filtro por membro selecionado
  const selM=ST.atvMembro;
  const actsView=selM?acts.filter(a=>acaoNome(a)===selM):acts;

  // Cards únicos do dia do membro selecionado (que existem no board)
  let cardsDoDia=[];
  if(selM){
    const seen=new Set();
    actsView.forEach(a=>{
      const cid=a.data&&a.data.card?a.data.card.id:null;
      if(cid&&!seen.has(cid)){
        seen.add(cid);
        const card=ST.cards.find(c=>c.id===cid);
        if(card) cardsDoDia.push(card);
      }
    });
  }

  function descAcao(a){
    const card=a.data&&a.data.card?a.data.card.name:'—';
    if(a.type==='updateCard'&&a.data.listBefore&&a.data.listAfter){
      return{icon:'fa-arrow-right-arrow-left',cor:'text-emerald-400',txt:`moveu <strong class="text-white">${esc(card)}</strong> de <span class="text-amber-400">${esc(a.data.listBefore.name)}</span> para <span class="text-emerald-400">${esc(a.data.listAfter.name)}</span>`};
    }
    if(a.type==='createCard'){
      return{icon:'fa-plus',cor:'text-blue-400',txt:`criou <strong class="text-white">${esc(card)}</strong>${a.data.list?` em <span class="text-blue-400">${esc(a.data.list.name)}</span>`:''}`};
    }
    if(a.type==='commentCard'){
      return{icon:'fa-comment',cor:'text-purple-400',txt:`comentou em <strong class="text-white">${esc(card)}</strong>`};
    }
    return{icon:'fa-circle',cor:'text-gray-500',txt:`atualizou <strong class="text-white">${esc(card)}</strong>`};
  }

  return`<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <p class="font-semibold text-sm">Participação ativa</p>
        <span class="text-[10px] text-emerald-400 bg-emerald-900/30 border border-emerald-800/40 px-2 py-0.5 rounded-full"><i class="fa-solid fa-circle text-[6px] mr-1"></i>no dia</span>
      </div>
      <p class="text-gray-500 text-xs mb-4">Quem mexeu em cards neste dia · clique no nome para ver os cards</p>
      ${rankArr.length?rankArr.map(([nome,n],i)=>`<div onclick="toggleAtvMembro('${esc(nome).replace(/'/g,"&#39;")}')" class="flex items-center gap-2 mb-3 cursor-pointer rounded-xl px-2 py-1.5 -mx-2 transition-colors ${selM===nome?'bg-emerald-950/50 border border-emerald-800/50':'hover:bg-gray-800/60 border border-transparent'}">
        <span class="text-gray-600 text-xs w-4 flex-shrink-0">${i+1}</span>
        <div class="w-6 h-6 rounded-full bg-emerald-950 border border-emerald-800 flex items-center justify-center text-[10px] font-bold text-emerald-300 flex-shrink-0">${ini(nome)}</div>
        <span class="text-sm flex-1 min-w-0 truncate ${selM===nome?'text-emerald-300 font-medium':''}">${esc(nome)}</span>
        <div class="w-14 h-1.5 bg-gray-800 rounded-full overflow-hidden flex-shrink-0"><div class="h-full bg-emerald-500 rounded-full" style="width:${Math.round(n/rankArr[0][1]*100)}%"></div></div>
        <span class="text-emerald-400 font-bold text-xs w-6 text-right flex-shrink-0">${n}</span>
      </div>`).join(''):'<p class="text-gray-600 text-sm">Nenhuma atividade registrada neste dia</p>'}
      ${selM?`<button onclick="ST.atvMembro=null;renderView()" class="w-full mt-2 text-xs text-gray-500 hover:text-white bg-gray-800 border border-gray-700 rounded-xl py-2 transition-colors">Limpar seleção</button>`:''}
    </div>
    <div class="md:col-span-2 space-y-4">
      ${selM?`<div class="bg-gray-900 border border-emerald-800/40 rounded-2xl p-5">
        <div class="flex items-center gap-2 mb-4">
          <div class="w-6 h-6 rounded-full bg-emerald-950 border border-emerald-800 flex items-center justify-center text-[10px] font-bold text-emerald-300 flex-shrink-0">${ini(selM)}</div>
          <p class="font-semibold text-sm">Cards do dia · ${esc(selM)}</p>
          <span class="ml-auto text-xs text-gray-600">${cardsDoDia.length} card${cardsDoDia.length!==1?'s':''}</span>
        </div>
        ${cardsDoDia.length?`<div class="space-y-0.5">
          ${cardsDoDia.map(card=>{
            const pp=progs(card);
            return`<div onclick='abrirCard(${JSON.stringify(card).replace(/'/g,"&#39;")})' class="flex items-center gap-3 py-2.5 px-2 -mx-2 rounded-xl border-b border-gray-800/60 last:border-0 cursor-pointer hover:bg-gray-800/50 transition-colors group">
              <div class="w-7 h-7 rounded-lg bg-emerald-900/30 border border-emerald-700/40 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-clipboard-check text-emerald-400 text-xs"></i></div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate group-hover:text-blue-300 transition-colors">${esc(card.name)}</p>
                <div class="flex gap-1 mt-0.5 flex-wrap">
                  <span class="text-[10px] text-gray-600">${esc(lNome(card.idList))}</span>
                  ${pp.map(p=>`<span class="text-[10px] bg-amber-900/30 text-amber-400 px-1.5 py-0.5 rounded-full">${esc(p)}</span>`).join('')}
                </div>
              </div>
              <i class="fa-solid fa-chevron-right text-gray-700 text-xs flex-shrink-0 group-hover:text-blue-400 transition-colors"></i>
            </div>`;
          }).join('')}
        </div>`:'<p class="text-gray-600 text-sm">Os cards que essa pessoa mexeu hoje não estão mais no board (ou foram excluídos).</p>'}
      </div>`:''}
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <p class="font-semibold text-sm">Atividade no board${selM?` · <span class="text-emerald-400">${esc(selM)}</span>`:''}</p>
          <button onclick="recarregarAtividade()" class="text-xs text-gray-500 hover:text-white flex items-center gap-1.5 bg-gray-800 border border-gray-700 rounded-lg px-2.5 py-1 transition-colors"><i class="fa-solid fa-rotate-right"></i>Atualizar</button>
        </div>
        <p class="text-gray-500 text-xs mb-4">${actsView.length} movimentaç${actsView.length===1?'ão':'ões'} no dia · mais recentes primeiro · clique para abrir o card</p>
        <div class="max-h-96 overflow-y-auto space-y-0.5 pr-1">
          ${actsView.length?actsView.slice(0,80).map(a=>{
            const d=descAcao(a);
            const hh=new Date(a.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
            const cid=a.data&&a.data.card?a.data.card.id:null;
            const cardObj=cid?ST.cards.find(c=>c.id===cid):null;
            const clicavel=!!cardObj;
            return`<div ${clicavel?`onclick='abrirCard(${JSON.stringify(cardObj).replace(/'/g,"&#39;")})'`:''} class="flex items-start gap-3 py-2 border-b border-gray-800/60 last:border-0 ${clicavel?'cursor-pointer hover:bg-gray-800/50 rounded-lg px-2 -mx-2 transition-colors group':''}">
              <div class="w-6 h-6 rounded-lg bg-gray-800 flex items-center justify-center flex-shrink-0 mt-0.5"><i class="fa-solid ${d.icon} ${d.cor} text-[10px]"></i></div>
              <div class="flex-1 min-w-0 text-xs leading-relaxed text-gray-400 ${clicavel?'group-hover:text-gray-300 transition-colors':''}">
                <strong class="text-gray-200">${esc(acaoNome(a))}</strong> ${d.txt}
              </div>
              <span class="text-[10px] text-gray-600 flex-shrink-0 mt-0.5">${hh}</span>
              ${clicavel?'<i class="fa-solid fa-chevron-right text-gray-700 text-[10px] flex-shrink-0 mt-1 group-hover:text-blue-400 transition-colors"></i>':''}
            </div>`;
          }).join(''):'<p class="text-gray-600 text-sm py-4 text-center">Nenhuma movimentação registrada neste dia</p>'}
        </div>
      </div>
    </div>
  </div>`;
}

function toggleAtvMembro(nome){
  ST.atvMembro=ST.atvMembro===nome?null:nome;
  renderView();
}

async function recarregarAtividade(){
  try{
    ST.actions=await req(`/boards/${BOARD}/actions?filter=updateCard:idList,createCard,commentCard&limit=1000`);
  }catch(e){}
  renderView();
}

              <p class="font-semibold text-sm truncate">${esc(nome)}</p>

              ${notasDe(nome).map(n=>`<p class="text-blue-400 text-[10px] mt-0.5"><i class="fa-solid ${normTxt(notaLabel(n)).includes('ferias')?'fa-umbrella-beach':'fa-plane'} mr-1"></i>${esc(notaLabel(n))}</p>`).join('')}
            </div>
          </div>
          <p class="${cols[i%cols.length]} text-2xl md:text-3xl font-bold mb-0.5">${info.count}</p>

// ============================================================
// PAUTAS ENTREGUES (antes "Programas")
// ============================================================
function renderPautas(mc){
  // Drilldown: se tem pauta selecionada, mostra os cards dela
  if(ST.pautaDetalhe){
    renderPautaDetalhe(mc, ST.pautaDetalhe);
    return;
  }
  const cards=filt();
  const pC={};cards.forEach(c=>progs(c).forEach(p=>{pC[p]=(pC[p]||0)+1;}));
  const sorted=Object.entries(pC).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?.[1]||1;
  mc.innerHTML=`<div class="fade-in max-w-5xl mx-auto">
    <h2 class="text-xl md:text-2xl font-bold mb-1">Pautas Entregues</h2>
    <p class="text-gray-500 text-sm mb-5">${sorted.length} pautas com posts no período · clique para ver os cards</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
      ${sorted.length?sorted.map(([prog,n])=>{
        const pc=cards.filter(c=>progs(c).includes(prog));
        const nt={instagram:0,tiktok:0,facebook:0,youtube:0};
        pc.forEach(c=>{const r=detectRede(c);if(r&&r in nt)nt[r]++;});
        const ms=new Set();pc.forEach(c=>(c.idMembers||[]).forEach(id=>ms.add(mNome(id))));
        return`<div onclick="ST.pautaDetalhe=${JSON.stringify(prog).replace(/</g,'\\u003c').replace(/"/g,'&quot;')};renderView()" class="bg-gray-900 border border-gray-800 rounded-2xl p-4 ch cursor-pointer hover:border-purple-700 transition-all">
          <div class="flex items-start justify-between mb-2">
            <p class="font-semibold text-sm leading-snug flex-1 pr-2">${esc(prog)}</p>
            <span class="text-xl font-bold text-purple-400 flex-shrink-0">${n}</span>
          </div>
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden mb-3"><div class="h-full bg-purple-500 rounded-full" style="width:${Math.round(n/max*100)}%"></div></div>
          <div class="flex gap-3 text-xs text-gray-500 flex-wrap">
            <span><i class="fa-solid fa-users mr-1"></i>${ms.size}</span>
            ${Object.entries(nt).filter(([,v])=>v>0).map(([r,v])=>`<span style="color:${REDES[r].cor}">${REDES[r].label.slice(0,2)} ${v}</span>`).join('')}
            <span class="ml-auto text-purple-500"><i class="fa-solid fa-chevron-right text-xs"></i></span>
          </div>
        </div>`;
      }).join(''):'<div class="col-span-3 text-center py-16 text-gray-600">Nenhuma pauta identificada</div>'}
    </div>
  </div>`;
}

function renderPautaDetalhe(mc, prog){
  const cards=filt().filter(c=>progs(c).includes(prog));
  cards.sort((a,b)=>{const da=dCard(a)||new Date(0),db=dCard(b)||new Date(0);return db-da;});
  mc.innerHTML=`<div class="fade-in max-w-4xl mx-auto">

function renderMix(mc){
  const cards=filt();
  const FMT=FORMATOS_ATIVOS();
  const cnt={};FMT.forEach(f=>cnt[f.k]=0);
  cards.forEach(c=>detectFormatos(c).forEach(k=>{if(k in cnt)cnt[k]++;}));
  const dados=FMT.map(f=>({label:f.label,k:f.k,n:cnt[f.k]})).filter(d=>d.n>0).sort((a,b)=>b.n-a.n);
  const total=dados.reduce((a,d)=>a+d.n,0);
  const cor=CURRENT_BRAND==='globoplay'?'#dc2626':CURRENT_BRAND==='telecine'?'#3b82f6':'#a855f7';
  const paleta=['#a855f7','#ec4899','#f97316','#eab308','#10b981','#06b6d4','#3b82f6','#8b5cf6','#f43f5e','#84cc16','#14b8a6','#6366f1'];

  // Alerta de concentração

  mc.innerHTML=`<div class="fade-in max-w-5xl mx-auto">

    </div>`:`<div class="bg-emerald-950/30 border border-emerald-900/40 rounded-2xl px-4 py-3 mb-4">
      <p class="text-emerald-300 text-sm"><i class="fa-solid fa-circle-check mr-1.5"></i>Boa distribuição: ${dados.length} formatos em uso e o líder (${esc(top.label)}) fica com ${pctTop}%.</p>

    });
  },50);
}

// ============================================================
// AGENDAMENTO — 100% dados do Trello (due date), 5 abas + mini-calendário
// ============================================================
function renderAgendamento(mc){
  const net=ST.aNet;
  const{days}=semana(ST.aWk);
  const dn=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const dnFull=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

  // Filtra cards pela rede selecionada
  // Agendamento usa a data do TÍTULO do card, não o due date
  // Cards com "Decupagem" vão para Data de Produção, não Agendamento
  const cardsComDataTitulo = [...new Map(ST.cards.filter(c=>dCardTitulo(c)!==null&&!isDecupagem(c)).map(c=>[c.id,c])).values()];
  function cardsNet(cards){
    if(net==='todos') return cards;
    return cards.filter(c=>detectRede(c)===net);
  }
  const allFiltered = cardsNet(cardsComDataTitulo);

  // Se tem dia selecionado, mostra só ele; senão mostra semana inteira
  let viewCards, viewLabel, isSingleDay=false;
  if(ST.aDia){
    const ds=new Date(ST.aDia); ds.setHours(0,0,0,0);
    const de=new Date(ST.aDia); de.setHours(23,59,59,999);
    viewCards=allFiltered.filter(c=>{const d=dCardTitulo(c);return d&&d>=ds&&d<=de;});
    viewLabel=ds.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
    isSingleDay=true;
  } else {
    const wS=days[0], wE=new Date(days[6]); wE.setHours(23,59,59,999);
    viewCards=allFiltered.filter(c=>{const d=dCardTitulo(c);return d&&d>=wS&&d<=wE;});
    viewLabel=null;
  }

  // Conta por rede para badges nos botões
  const wS2=days[0], wE2=new Date(days[6]); wE2.setHours(23,59,59,999);
  const netCounts={todos:0,instagram:0,tiktok:0,facebook:0,youtube:0};
  cardsComDataTitulo.forEach(c=>{
    const d=dCardTitulo(c); if(!d||d<wS2||d>wE2) return;
    netCounts.todos++;
    const r=detectRede(c); if(r&&r in netCounts) netCounts[r]++;
  });

  // Botões de rede (5: Todos + 4 redes)
  const netBtns=[
    {k:'todos', label:'Todos', icon:'fa-solid fa-layer-group', cor:'#6366f1', grad:'from-indigo-600 to-indigo-900'},
    ...Object.entries(REDES).map(([k,m])=>({k,label:m.label,icon:m.icon,cor:m.cor,grad:m.grad}))
  ];

  // Mini calendário: mês atual do primeiro dia da semana
  const calRef=days[0];
  const miniCal=buildMiniCal(calRef);

  mc.innerHTML=`<div class="fade-in max-w-4xl mx-auto">
    <h2 class="text-xl md:text-2xl font-bold mb-1">Agendamento</h2>
    <p class="text-gray-500 text-sm mb-5">Agendamento de posts · dados do Trello</p>

    <!-- Botões de rede -->
    <div class="grid grid-cols-3 md:grid-cols-5 gap-2 mb-5">
      ${netBtns.map(({k,label,icon,cor,grad})=>`
        <button onclick="ST.aNet='${k}';ST.aDia=null;renderView()"
          class="rounded-2xl p-2.5 md:p-3 flex flex-col items-center gap-1.5 border transition-all bg-gradient-to-br ${grad} ${ST.aNet===k?'border-white/25 scale-[1.02]':'border-transparent opacity-55 hover:opacity-80'}">
          <i class="${icon} text-xl md:text-2xl"></i>
          <span class="font-semibold text-xs">${label}</span>
          <span class="text-white/60 text-[10px]">${netCounts[k]}</span>
        </button>`).join('')}
    </div>

    <!-- Linha: nav semana + mini calendário toggle -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">
      <button onclick="ST.aWk--;ST.aDia=null;renderView()" class="px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-xl text-sm text-gray-400 hover:text-white transition-colors">‹ Anterior</button>
      <span class="text-sm font-medium text-gray-300">${fmtD(days[0])} – ${fmtD(days[6])}</span>
      <button onclick="ST.aWk++;ST.aDia=null;renderView()" class="px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-xl text-sm text-gray-400 hover:text-white transition-colors">Próxima ›</button>
      ${ST.aWk!==0||ST.aDia?`<button onclick="ST.aWk=0;ST.aDia=null;renderView()" class="px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-xl text-xs text-gray-500 hover:text-white">Hoje</button>`:''}
      <button onclick="toggleMiniCal()" class="ml-auto flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-xl text-xs text-gray-400 hover:text-white hover:border-blue-500 transition-colors">
        <i class="fa-solid fa-calendar-days text-blue-400"></i> Escolher dia
      </button>

function buildMiniCal(refDate){
  // Monta mini calendário do mês do refDate
  const now=new Date();
  const ano=refDate.getFullYear(), mes=refDate.getMonth();
  const primeiroDia=new Date(ano,mes,1).getDay(); // 0=dom
  const diasNoMes=new Date(ano,mes+1,0).getDate();
  const nomeMes=refDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const ds=['D','S','T','Q','Q','S','S'];
  let cells='';
  const offset=(primeiroDia+6)%7; // segunda=0
  for(let i=0;i<offset;i++) cells+=`<div></div>`;
  for(let d=1;d<=diasNoMes;d++){
    const dt=new Date(ano,mes,d);
    const iso=`${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dt.toDateString()===now.toDateString();
    const isSel=ST.aDia===iso;
    // Conta posts nesse dia para a rede selecionada
    const dsS=new Date(dt);dsS.setHours(0,0,0,0);
    const dsE=new Date(dt);dsE.setHours(23,59,59,999);
    const hasPosts=ST.cards.filter(c=>!isDecupagem(c)).some(c=>{
      if(ST.aNet!=='todos'&&detectRede(c)!==ST.aNet) return false;
      const dd=dCardTitulo(c); return dd&&dd>=dsS&&dd<=dsE;
    });
    cells+=`<button onclick="selecionarDia('${iso}')"
      class="w-full aspect-square flex flex-col items-center justify-center rounded text-[10px] transition-colors relative
        ${isSel?'bg-blue-600 text-white font-bold':isToday?'bg-blue-950/80 text-blue-400 font-semibold':'text-gray-500 hover:bg-gray-800 hover:text-white'}">
      ${d}
      ${hasPosts&&!isSel?'<span class="absolute bottom-px left-1/2 -translate-x-1/2 w-0.5 h-0.5 rounded-full bg-blue-400"></span>':''}
    </button>`;
  }
  return`<div class="bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs">
    <div class="flex items-center justify-between mb-2">
      <button onclick="shiftMiniCal(-1)" class="w-5 h-5 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 hover:text-white text-xs leading-none">‹</button>
      <span class="text-[11px] font-semibold text-gray-300 capitalize">${nomeMes}</span>
      <button onclick="shiftMiniCal(1)" class="w-5 h-5 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 hover:text-white text-xs leading-none">›</button>
    </div>
    <div class="grid grid-cols-7 gap-px mb-0.5">
      ${ds.map(d=>`<div class="text-center text-[9px] text-gray-700 font-semibold pb-0.5">${d}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7 gap-px">${cells}</div>
  </div>`;
}

function toggleMiniCal(){
  const el=document.getElementById('mini-cal');
  if(el) el.classList.toggle('hidden');
}
function selecionarDia(iso){
  ST.aDia=iso;
  // Ajusta semana para conter o dia
  const d=new Date(iso);
  const dow=d.getDay(); // 0=dom
  const seg=new Date(d); seg.setDate(d.getDate()-((dow+6)%7));
  const now=new Date();
  const segAtual=new Date(now); segAtual.setDate(now.getDate()-((now.getDay()+6)%7));
  const diffMs=seg.getTime()-segAtual.getTime();
  ST.aWk=Math.round(diffMs/(7*24*3600*1000));
  renderView();
}
function shiftMiniCal(dir){
  // Shift o mês do mini-cal sem alterar semana
  const{days}=semana(ST.aWk);
  const ref=days[0];
  const m=new Date(ref.getFullYear(),ref.getMonth()+dir,1);
  ST.aWk=ST.aWk; // just re-render same week but new cal month won't persist without extra state
  // Simple: rebuild mini-cal only
  const el=document.getElementById('mini-cal');
  if(el){el.innerHTML=buildMiniCal(m);el.classList.remove('hidden');}
}

function renderAgendBody(viewCards, isSingleDay, days, dnFull, net){

          ${isTd?'<span class="text-xs text-blue-400 font-medium">Hoje</span>':''}
          ${cards.length?`<span class="ml-auto text-xs font-semibold" style="color:${corDia}">${cards.length} post${cards.length!==1?'s':''}</span>`:''}

function renderAjustes(mc){
  // Todos os cards com qualquer tipo de ajuste, DEDUPLICADOS por id
  // e RESPEITANDO o período selecionado no topo (Dia/Semana/Mês/Ano)
  const{s,e}=getRange();
  const todos=[...new Map(ST.cards.map(c=>[c.id,c])).values()]
    .filter(c=>isAjuste(c)||tiposAjuste(c).length>0)
    .filter(c=>{const d=dCard(c)||dCardTitulo(c);return d&&d>=s&&d<=e;});

  // Contagem por tipo (dentro do período)
  const cntTipo={};AJUSTE_TIPOS_ATIVOS().forEach(t=>cntTipo[t.k]=0);
  todos.forEach(c=>{tiposAjuste(c).forEach(k=>cntTipo[k]++);});

  // Filtro multi-select ativo (vazio = todos)
  const sel=ST.ajTipos||[];
  let cards=todos;
  if(sel.length){
    cards=todos.filter(c=>{const ts=tiposAjuste(c);return sel.some(k=>ts.includes(k));});

function renderNotas(mc){
  // Carrega a planilha na primeira abertura
  if(!ST.crono&&!ST.cronoLoading){
    ST.cronoLoading=true;
    fetchCrono().then(()=>{ST.cronoLoading=false;if(ST.view==='notas')renderView();});
  }
  const hoje=new Date();
  const mesSel=ST.cronoMes!==null&&ST.cronoMes!==undefined?ST.cronoMes:hoje.getMonth();
  const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const MESF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  const notas=getNotas();
  // Ausências que tocam o mês selecionado
  const ano=2026;
  const ms=new Date(ano,mesSel,1,0,0,0,0), me=new Date(ano,mesSel+1,0,23,59,59,999);
  const doMes=notas.filter(n=>notaInicio(n)<=me&&notaFim(n)>=ms).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  // Contagem por mês para os chips
  const cntMes=MES.map((_,i)=>{
    const s=new Date(ano,i,1),e=new Date(ano,i+1,0,23,59,59,999);
    return notas.filter(n=>notaInicio(n)<=e&&notaFim(n)>=s).length;
  });

  function statusNota(n){
    if(hoje>=notaInicio(n)&&hoje<=notaFim(n)) return{t:'Em vigor',cls:'text-emerald-400 bg-emerald-900/30 border-emerald-800/40'};
    if(hoje>notaFim(n)) return{t:'Encerrada',cls:'text-gray-500 bg-gray-800 border-gray-700'};
    return{t:'Futura',cls:'text-amber-400 bg-amber-900/30 border-amber-800/40'};
  }
  function fmtBR(iso){const[y,m,d]=iso.split('-');return`${d}/${m}`;}
  function isFerias(n){return normTxt(n.desc||'').includes('ferias');}

  mc.innerHTML=`<div class="fade-in max-w-4xl mx-auto">
    <div class="flex items-center gap-3 mb-1 flex-wrap">
      <h2 class="text-xl md:text-2xl font-bold">Cronograma Globers</h2>
      <a href="${CRONO_URL}" target="_blank" class="ml-auto text-xs text-gray-300 hover:text-white bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 transition-colors"><i class="fa-solid fa-table-cells mr-1.5 text-emerald-400"></i>Abrir planilha</a>
      <button onclick="ST.cronoLoading=true;renderView();fetchCrono(true).then(()=>{ST.cronoLoading=false;renderView();})" class="text-xs text-gray-500 hover:text-white bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 transition-colors" title="Atualizar da planilha"><i class="fa-solid fa-rotate-right ${ST.cronoLoading?'fa-spin':''}"></i></button>
    </div>
    <p class="text-gray-500 text-sm mb-5">Ausências do time lidas direto da planilha compartilhada. Alterou lá, atualizou aqui para todo mundo.</p>

    ${ST.cronoErro?`<div class="bg-red-950/50 border border-red-900 rounded-2xl px-4 py-3 mb-4">
      <p class="text-red-300 text-sm font-semibold mb-1"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>Não consegui ler a planilha</p>
      <p class="text-red-200/70 text-xs leading-relaxed mb-2">${esc(ST.cronoErro)}</p>
      <p class="text-red-200/60 text-[11px] leading-relaxed">Confira se a planilha está publicada: <strong>Arquivo → Compartilhar → Publicar na web → aba Cronograma Globers → CSV → Publicar</strong>. Depois cole o link aqui:</p>
      <button onclick="trocarLinkCrono()" class="mt-2 text-xs bg-red-900/60 hover:bg-red-800 border border-red-800 text-red-100 rounded-lg px-3 py-1.5 transition-colors"><i class="fa-solid fa-link mr-1.5"></i>Colar link publicado</button>
    </div>`:ST.cronoInfo?`<div class="flex items-center gap-2 flex-wrap bg-emerald-950/30 border border-emerald-900/40 rounded-xl px-3 py-2 mb-4 text-[11px]">
      <span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i>Planilha lida via <strong>${esc(ST.cronoInfo.fonte)}</strong></span>
      <span class="text-gray-500">${ST.cronoInfo.linhas} linha${ST.cronoInfo.linhas!==1?'s':''} · ${ST.cronoInfo.ausencias} ausência${ST.cronoInfo.ausencias!==1?'s':''} válida${ST.cronoInfo.ausencias!==1?'s':''}</span>
      <span class="text-gray-600">atualizado ${esc(ST.cronoInfo.hora)}</span>
      <button onclick="trocarLinkCrono()" class="ml-auto text-gray-600 hover:text-gray-300 transition-colors" title="Trocar link da planilha"><i class="fa-solid fa-link"></i></button>
    </div>`:''}
    ${ST.cronoLoading&&!notas.length?`<div class="bg-gray-900 border border-gray-800 rounded-2xl p-10 text-center text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block"></i>Lendo a planilha...</div>`:`

    <!-- Chips de mês -->
    <div class="flex gap-1.5 mb-5 overflow-x-auto pb-1">
      ${MES.map((m,i)=>`
        <button onclick="ST.cronoMes=${i};renderView()" class="flex flex-col items-center px-3 py-2 rounded-xl border text-xs font-semibold transition-all flex-shrink-0
          ${mesSel===i?'bg-blue-600 border-blue-500 text-white':'bg-gray-900 border-gray-800 text-gray-400 hover:text-white hover:border-gray-600'}">
          <span>${m}</span>
          <span class="text-[9px] font-normal ${mesSel===i?'text-blue-200':cntMes[i]?'text-blue-400':'text-gray-700'}">${cntMes[i]||'·'}</span>
        </button>`).join('')}
    </div>

    <!-- Cards do mês -->
    <p class="text-gray-500 text-xs mb-3 font-semibold uppercase tracking-wider">${MESF[mesSel]} · ${doMes.length} ausência${doMes.length!==1?'s':''}</p>
    ${doMes.length?`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      ${doMes.map(n=>{
        const st=statusNota(n);
        return`<button onclick='abrirCronoCard(${JSON.stringify(n.id)})' class="text-left bg-gray-900 border border-gray-800 rounded-2xl p-4 hover:border-blue-600 transition-all ch group">
          <div class="flex items-center gap-3 mb-2">
            <div class="w-9 h-9 rounded-full bg-blue-950 border border-blue-800 flex items-center justify-center text-xs font-bold text-blue-300 flex-shrink-0">${ini(n.nome)}</div>
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-sm truncate group-hover:text-blue-300 transition-colors">${esc(n.nome)}</p>
              <p class="text-gray-500 text-xs">${fmtBR(n.inicio)} até ${fmtBR(n.fim)}</p>
            </div>
            <span class="text-[10px] border px-2 py-0.5 rounded-full flex-shrink-0 ${st.cls}">${st.t}</span>
          </div>
          <p class="text-xs text-gray-400"><i class="fa-solid ${isFerias(n)?'fa-umbrella-beach text-amber-400':'fa-plane text-blue-400'} mr-1.5"></i>${esc(n.desc||'Ausência')}</p>
        </button>`;
      }).join('')}
    </div>`:`<div class="bg-gray-900 border border-gray-800 rounded-2xl p-10 text-center text-gray-600">
      <i class="fa-solid fa-mug-hot text-3xl mb-3 block text-gray-700"></i>
      <p class="text-sm">Ninguém ausente em ${MESF[mesSel]}. Time completo!</p>
    </div>`}
    <p class="text-gray-600 text-[11px] mt-4"><i class="fa-solid fa-circle-info mr-1"></i>Para adicionar ou corrigir uma ausência, edite a planilha (botão acima): uma linha por ausência, com Nome, Saída, Retorno e Observação. As etiquetas ao lado dos nomes no Dashboard e o aproveitamento da Análise Mensal usam esses mesmos dados. O Google leva de 1 a 5 minutos para propagar alterações no link publicado: se acabou de editar, aguarde e clique em atualizar.</p>
    `}
  </div>`;
}

function abrirCronoCard(id){
  const n=getNotas().find(x=>x.id===id);
  if(!n) return;
  const hoje=new Date();
  const emVigor=hoje>=notaInicio(n)&&hoje<=notaFim(n);
  const fmtLong=iso=>{const[y,m,d]=iso.split('-');return new Date(+y,+m-1,+d).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});};
  // Dias úteis do período
  let du=0;const cur=notaInicio(n),fim=notaFim(n);
  const c2=new Date(cur);
  while(c2<=fim){const wd=c2.getDay();if(wd>=1&&wd<=5)du++;c2.setDate(c2.getDate()+1);}
  const isFerias=normTxt(n.desc||'').includes('ferias');

  let overlay=document.getElementById('modal-crono');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='modal-crono';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML=`<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="if(event.target===this)fecharCronoCard()">
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 w-full max-w-md fade-in">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-11 h-11 rounded-full bg-blue-950 border border-blue-800 flex items-center justify-center text-sm font-bold text-blue-300 flex-shrink-0">${ini(n.nome)}</div>
        <div class="flex-1 min-w-0">
          <p class="font-bold truncate">${esc(n.nome)}</p>
          <p class="text-xs ${emVigor?'text-emerald-400':'text-gray-500'}">${emVigor?'✓ Ausente agora':'Ausência '+(hoje>notaFim(n)?'encerrada':'programada')}</p>
        </div>
        <button onclick="fecharCronoCard()" class="w-7 h-7 flex items-center justify-center rounded-lg text-gray-500 hover:text-white hover:bg-gray-800 transition-colors text-lg flex-shrink-0">×</button>
      </div>
      <div class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-4 mb-3">
        <p class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider mb-1.5"><i class="fa-solid ${isFerias?'fa-umbrella-beach text-amber-400':'fa-plane text-blue-400'} mr-1"></i>Motivo</p>
        <p class="text-sm text-gray-200">${esc(n.desc||'Ausência')}</p>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-4">
          <p class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider mb-1.5">Saída</p>
          <p class="text-sm text-gray-200 capitalize">${fmtLong(n.inicio)}</p>
        </div>
        <div class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-4">
          <p class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider mb-1.5">Retorno</p>
          <p class="text-sm text-gray-200 capitalize">${fmtLong(n.fim)}</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 text-center">${du} dia${du!==1?'s':''} út${du!==1?'eis':'il'} fora · a etiqueta aparece automaticamente ao lado do nome no Dashboard</p>
    </div>
  </div>`;
}
function fecharCronoCard(){const o=document.getElementById('modal-crono');if(o)o.innerHTML='';}
